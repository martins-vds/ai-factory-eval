<section class="rounded-box border border-[#d8cdbb] bg-[#fffdf7] p-5 sm:p-6">
  <p class="text-xs font-semibold uppercase tracking-[0.2em] text-[#a94e37]">Loan details</p>
  <h2 class="mt-3 font-serif text-2xl font-semibold">{{ loan.id }}</h2>
  <dl class="mt-5 space-y-4 text-sm">
    <div>
      <dt class="font-semibold text-[#626658]">Member</dt>
      <dd class="mt-1">{{ loan.member }}</dd>
    </div>
    <div>
      <dt class="font-semibold text-[#626658]">ISBN</dt>
      <dd class="mt-1">{{ loan.isbn }}</dd>
    </div>
    <div>
      <dt class="font-semibold text-[#626658]">Lent</dt>
      <dd class="mt-1"><time datetime="{{ loan.lent_on|date:'Y-m-d' }}">{{ loan.lent_on|date:"M j, Y" }}</time></dd>
    </div>
    <div>
      <dt class="font-semibold text-[#626658]">Due</dt>
      <dd class="mt-1"><time datetime="{{ loan.due_on|date:'Y-m-d' }}">{{ loan.due_on|date:"M j, Y" }}</time></dd>
    </div>
    <div>
      <dt class="font-semibold text-[#626658]">Returned</dt>
      <dd class="mt-1">
        {% if loan.returned_on %}
        <time datetime="{{ loan.returned_on|date:'Y-m-d' }}">{{ loan.returned_on|date:"M j, Y" }}</time>
        {% else %}
        Not yet returned
        {% endif %}
      </dd>
    </div>
  </dl>
</section>

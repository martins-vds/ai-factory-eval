{% extends "base.html" %}

{% block title %}Loan not found · The Lending Library{% endblock %}

{% block content %}
<section class="mx-auto max-w-2xl rounded-box border border-[#d8cdbb] bg-[#fffdf7] p-8" role="alert">
  <p class="text-xs font-semibold uppercase tracking-[0.2em] text-[#a94e37]">Catalog</p>
  <h1 class="mt-3 font-serif text-3xl font-semibold">No loan was found.</h1>
  <p class="mt-3 text-[#626658]">The loan may have been removed from the catalog.</p>
  <a class="btn btn-outline mt-6 min-h-11 border-[#a94e37] text-[#783b2b]" href="{% url 'loan_catalog' %}">Return to loans</a>
</section>
{% endblock %}

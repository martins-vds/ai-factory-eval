{% extends "base.html" %}

{% block title %}Lend a book · The Lending Library{% endblock %}

{% block content %}
<section class="mx-auto max-w-2xl">
  <a class="link link-hover text-[#a94e37]" href="/ui/loans/">← Back to the collection</a>
  <div class="card mt-6 border border-[#d8cdbb] bg-[#fffdf7] shadow-sm">
    <div class="card-body">
      <p class="text-xs uppercase tracking-[.2em] text-[#66705b]">At the desk</p>
      <h1 class="card-title text-4xl">Lend a book</h1>
      <p class="text-[#66705b]">A new loan is due in 14 days.</p>
      <form method="post" action="/ui/loans/new/" hx-post="/ui/loans/new/" hx-target="body" hx-swap="innerHTML" class="mt-4 space-y-4">
        {% csrf_token %}
        <label class="form-control">
          <span class="label-text mb-1">Member name</span>
          <input class="input input-bordered" name="member" value="{{ form.member.value|default:'' }}" autocomplete="name" required aria-invalid="{{ form.member.errors|yesno:'true,false' }}">
          {% for error in form.member.errors %}<span class="text-sm text-red-700" role="alert">{{ error }}</span>{% endfor %}
        </label>
        <label class="form-control">
          <span class="label-text mb-1">ISBN</span>
          <input class="input input-bordered" name="isbn" value="{{ form.isbn.value|default:'' }}" required aria-invalid="{{ form.isbn.errors|yesno:'true,false' }}">
          {% for error in form.isbn.errors %}<span class="text-sm text-red-700" role="alert">{{ error }}</span>{% endfor %}
        </label>
        <button class="btn btn-primary w-full" type="submit">Lend · 14 days</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}

{% extends "base.html" %}

{% block title %}Lend a book · The Lending Library{% endblock %}

{% block content %}
<section class="mx-auto max-w-3xl">
  <a class="link link-hover text-[#a94e37]" href="/ui/loans/">← Back to the collection</a>
  <article class="card mt-6 border border-[#d8cdbb] bg-[#fffdf7] shadow-sm">
    <div class="card-body">
      <p class="text-xs uppercase tracking-[.2em] text-[#66705b]">At the desk</p>
      <h1 class="card-title mt-2 text-4xl">Lend a book.</h1>
      <p class="mt-2 text-[#66705b]">A new loan is due fourteen days from today.</p>
      <form id="loan-form" class="mt-6 grid gap-5" method="post" action="/ui/loans/new/" hx-post="/ui/loans/new/" hx-target="#loan-form" hx-select="#loan-form" hx-swap="outerHTML">
        {% csrf_token %}
        {% for field in form %}
        <label class="form-control w-full">
          <span class="label-text mb-2">{{ field.label }}</span>
          {{ field }}
          {% for error in field.errors %}
          <span class="label-text-alt mt-1 text-error">{{ error }}</span>
          {% endfor %}
        </label>
        {% endfor %}
        <button class="btn btn-primary w-fit" type="submit">Lend this book</button>
      </form>
    </div>
  </article>
</section>
{% endblock %}

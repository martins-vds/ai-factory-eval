{% extends "base.html" %}

{% block title %}Lend a book · The Lending Library{% endblock %}

{% block content %}
<section class="mx-auto max-w-3xl">
  <a class="link link-hover text-[#a94e37]" href="/ui/loans/">← Back to the collection</a>
  <article class="card mt-6 border border-[#d8cdbb] bg-[#fffdf7] shadow-sm">
    <div class="card-body">
      <p class="text-xs uppercase tracking-[.2em] text-[#66705b]">At the circulation desk</p>
      <h1 class="card-title mt-2 text-4xl">Lend a book</h1>
      <p class="mt-2 text-[#66705b]">Record who is taking a book home.</p>
      <form class="mt-6 grid gap-5" method="post" action="/ui/loans/new/">
        {% csrf_token %}
        <label class="form-control">
          <span class="label-text mb-2">Member name</span>
          <input class="input input-bordered border-[#d8cdbb] bg-white" name="member" maxlength="255" value="{{ form.member.value|default_if_none:'' }}" required>
          {% for error in form.member.errors %}
          <span class="mt-2 text-sm text-[#a94e37]" role="alert">{{ error }}</span>
          {% endfor %}
        </label>
        <label class="form-control">
          <span class="label-text mb-2">ISBN</span>
          <input class="input input-bordered border-[#d8cdbb] bg-white" name="isbn" maxlength="255" value="{{ form.isbn.value|default_if_none:'' }}" required>
          {% for error in form.isbn.errors %}
          <span class="mt-2 text-sm text-[#a94e37]" role="alert">{{ error }}</span>
          {% endfor %}
        </label>
        <button class="btn btn-primary w-fit bg-[#a94e37] text-white hover:bg-[#873d2b]" type="submit">Create loan</button>
      </form>
    </div>
  </article>
</section>
{% endblock %}

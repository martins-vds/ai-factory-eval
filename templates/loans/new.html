{% extends "base.html" %}

{% block title %}Lend a book · The Lending Library{% endblock %}

{% block content %}
<section class="mx-auto max-w-3xl">
  <a class="link link-hover text-[#a94e37]" href="/ui/loans/">← Back to the collection</a>
  <article class="card mt-6 border border-[#d8cdbb] bg-[#fffdf7] shadow-sm">
    <div class="card-body">
      <p class="text-xs uppercase tracking-[.2em] text-[#66705b]">At the desk</p>
      <h1 class="card-title mt-2 text-4xl">Lend a book.</h1>
      <form method="post" action="/ui/loans/new/" class="grid gap-4">
        {% csrf_token %}
        <label class="form-control">
          <span class="label-text">Member</span>
          {{ form.member }}
          {% for error in form.member.errors %}<span class="text-[#a94e37]" role="alert">{{ error }}</span>{% endfor %}
        </label>
        <label class="form-control">
          <span class="label-text">ISBN</span>
          {{ form.isbn }}
          {% for error in form.isbn.errors %}<span class="text-[#a94e37]" role="alert">{{ error }}</span>{% endfor %}
        </label>
        <button class="btn btn-primary" type="submit">Record loan</button>
      </form>
    </div>
  </article>
</section>
{% endblock %}

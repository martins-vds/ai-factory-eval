{% extends "base.html" %}

{% block title %}Lend a book · The Lending Library{% endblock %}

{% block content %}
<section class="mx-auto max-w-3xl">
  <a class="link link-hover text-[#a94e37]" href="/ui/loans/">← Back to the collection</a>
  <h1 class="mb-4 mt-3 text-4xl">Lend a book.</h1>
  <p class="mb-6 text-[#66705b]">Add a reader and the book they are taking home.</p>
  {% include "loans/_lend_form.html" %}
</section>
<script>
  document.body.addEventListener('htmx:beforeSwap', (event) => {
    if (event.detail.xhr.status >= 400) event.detail.shouldSwap = true;
  });
</script>
{% endblock %}

<div id="lend-form-region">
  <form id="lend-form" class="card border border-[#d8cdbb] bg-[#fffdf7] shadow-sm" method="post" action="/ui/loans/new/" hx-post="/ui/loans/new/" hx-target="#lend-form-region" hx-swap="outerHTML">
    {% csrf_token %}
    <div class="card-body">
      <p class="text-xs uppercase tracking-widest text-[#66705b]">At the desk</p>
      <h2 class="card-title text-2xl">Lend a book</h2>
      <div class="form-control">
        <label class="label" for="id_member"><span class="label-text">Member</span></label>
        <input class="input input-bordered" id="id_member" name="member" value="{{ form.member.value|default_if_none:'' }}" aria-invalid="{{ form.member.errors|yesno:'true,false' }}" {% if form.member.errors %}aria-describedby="member-error"{% endif %}>
        {% if form.member.errors %}<p class="mt-1 text-sm text-[#a94e37]" id="member-error" role="alert">{{ form.member.errors.0 }}</p>{% endif %}
      </div>
      <div class="form-control">
        <label class="label" for="id_isbn"><span class="label-text">ISBN</span></label>
        <input class="input input-bordered" id="id_isbn" name="isbn" value="{{ form.isbn.value|default_if_none:'' }}" aria-invalid="{{ form.isbn.errors|yesno:'true,false' }}" {% if form.isbn.errors %}aria-describedby="isbn-error"{% endif %}>
        {% if form.isbn.errors %}<p class="mt-1 text-sm text-[#a94e37]" id="isbn-error" role="alert">{{ form.isbn.errors.0 }}</p>{% endif %}
      </div>
      <button class="btn bg-[#a94e37] text-white hover:bg-[#873c2b]" type="submit">Add to the collection</button>
    </div>
  </form>
</div>

<div id="loan-status">
  {% if error %}
  <p class="text-error" role="alert">{{ error }}</p>
  {% elif loan.returned_on %}
  <p class="text-sm text-[#66705b]" role="status">Returned {{ loan.returned_on|date:"M j, Y" }}</p>
  {% else %}
  <form
    action="/ui/loans/{{ loan.id }}/return/"
    method="post"
    hx-post="/ui/loans/{{ loan.id }}/return/"
    hx-target="#loan-status"
    hx-swap="outerHTML"
    hx-on::before-swap="if (event.detail.xhr.status >= 400) event.detail.shouldSwap = true"
  >
    {% csrf_token %}
    <button class="btn btn-primary" type="submit">Return book</button>
  </form>
  {% endif %}
</div>

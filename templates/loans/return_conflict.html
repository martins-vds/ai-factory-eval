{% extends "base.html" %}

{% block title %}Already returned · The Lending Library{% endblock %}

{% block content %}
<section class="mx-auto max-w-3xl">
  <a class="link link-hover text-[#a94e37]" href="/ui/loans/">← Back to the collection</a>
  <div class="alert mt-8 border border-[#d8cdbb] bg-[#fffdf7]">
    <p>Loan {{ loan.id }} was already returned on {{ loan.returned_on|date:"M j, Y" }}. The original return date has been kept.</p>
  </div>
</section>
{% endblock %}

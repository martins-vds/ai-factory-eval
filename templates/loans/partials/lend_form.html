<form id="lend-form" class="mt-6 grid gap-4" method="post" action="/ui/loans/new/"
      hx-post="/ui/loans/new/" hx-target="#lend-form" hx-swap="outerHTML"
      hx-on::before-swap="if (event.detail.xhr.status >= 400) event.detail.shouldSwap = true">
  {% csrf_token %}
  <div>
    <label class="label" for="member"><span class="label-text">Member</span></label>
    <input class="input input-bordered" id="member" name="member" value="{{ values.member }}" required>
    {% if errors.member %}<p class="mt-2 text-sm text-[#a94e37]" role="alert">{{ errors.member }}</p>{% endif %}
  </div>
  <div>
    <label class="label" for="isbn"><span class="label-text">ISBN</span></label>
    <input class="input input-bordered" id="isbn" name="isbn" value="{{ values.isbn }}" required>
    {% if errors.isbn %}<p class="mt-2 text-sm text-[#a94e37]" role="alert">{{ errors.isbn }}</p>{% endif %}
  </div>
  <button class="btn btn-primary" type="submit">Lend this book</button>
</form>

<div class="divide-y divide-[#d8cdbb]">
  {% for loan in loans %}
  <article class="grid gap-4 py-5 sm:grid-cols-[1fr_auto]">
    <div>
      <h2 class="text-xl font-semibold"><a class="underline decoration-[#d8cdbb] underline-offset-4" href="/ui/loans/{{ loan.id }}/">Loan {{ loan.id }}</a></h2>
      <p class="mt-1 text-[#66705b]">{{ loan.member }} · ISBN {{ loan.isbn }}</p>
    </div>
    <div class="sm:text-right">
      <p>Due {{ loan.due_on|date:"M j, Y" }}</p>
      {% if loan.returned_on %}
      <p class="text-sm text-[#66705b]">Returned {{ loan.returned_on|date:"M j, Y" }}</p>
      {% else %}
      <p class="mt-2 text-sm font-semibold text-[#a94e37]">On loan</p>
      {% endif %}
    </div>
  </article>
  {% empty %}
  <p class="border-t border-[#d8cdbb] py-6 text-[#66705b]">There are no loans in the collection yet.</p>
  {% endfor %}
</div>

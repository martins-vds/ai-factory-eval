<article id="loan-{{ loan.id }}" class="grid gap-4 py-5 sm:grid-cols-[1fr_auto]">
  <div>
    <h2 class="text-xl font-semibold"><a class="underline decoration-[#d8cdbb] underline-offset-4" href="/ui/loans/{{ loan.id }}/">Loan {{ loan.id }}</a></h2>
    <p class="mt-1 text-[#66705b]">{{ loan.member }} · ISBN {{ loan.isbn }}</p>
  </div>
  <div class="sm:text-right">
    <p>Due {{ loan.due_on|date:"M j, Y" }}</p>
    {% if loan.returned_on %}
    <p class="text-sm text-[#66705b]">Returned {{ loan.returned_on|date:"M j, Y" }}</p>
    {% else %}
    <p class="mt-2 text-sm font-semibold text-[#a94e37]">On loan</p>
    <form method="post" action="/ui/loans/{{ loan.id }}/return/" hx-post="/ui/loans/{{ loan.id }}/return/" hx-target="#loan-{{ loan.id }}" hx-swap="outerHTML">
      {% csrf_token %}
      <button class="btn btn-sm btn-outline mt-3 border-[#a94e37] text-[#a94e37]" type="submit">Mark returned</button>
    </form>
    {% endif %}
    {% if feedback %}<p class="mt-2 text-sm text-[#66705b]" role="status">{{ feedback }}</p>{% endif %}
  </div>
</article>

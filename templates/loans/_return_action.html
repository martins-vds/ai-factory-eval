<div id="return-action" class="mt-6">
  {% if message %}<p role="status" class="alert alert-info mb-4">{{ message }}</p>{% endif %}
  {% if not loan.returned_on %}
  <form method="post" action="/ui/loans/{{ loan.id }}/return/"
        hx-post="/ui/loans/{{ loan.id }}/return/" hx-target="#return-action" hx-swap="outerHTML">
    {% csrf_token %}
    <button class="btn btn-primary" type="submit">Mark returned</button>
  </form>
  {% else %}
  <p role="status" class="text-sm text-[#66705b]">Returned {{ loan.returned_on|date:"M j, Y" }}</p>
  {% endif %}
</div>

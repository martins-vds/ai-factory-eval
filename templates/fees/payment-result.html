{% extends "base.html" %}

{% block title %}Payment status · The Lending Library{% endblock %}

{% block content %}
<section class="mx-auto max-w-3xl">
  <a class="link link-hover text-[#a94e37]" href="/ui/fees/{{ loan_id }}/">← Back to the fee</a>
  <article class="card mt-6 border border-[#d8cdbb] bg-[#fffdf7] shadow-sm">
    <div class="card-body">
      <h1 class="text-4xl">Payment status</h1>
      <div role="{% if success %}status{% else %}alert{% endif %}">
        {% if success %}<p>Payment received.</p>{% else %}<p>{{ message }}</p>{% endif %}
      </div>
    </div>
  </article>
</section>
{% endblock %}

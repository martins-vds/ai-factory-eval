<div id="payment-status" class="mt-4" role="{% if success %}status{% else %}alert{% endif %}">
  {% if success %}
  <p>Payment received.</p>
  {% else %}
  <p>{{ message }}</p>
  <p class="mt-2"><a class="link link-hover text-[#a94e37]" href="/ui/fees/{{ loan_id }}/">Return to the fee page</a></p>
  {% endif %}
</div>

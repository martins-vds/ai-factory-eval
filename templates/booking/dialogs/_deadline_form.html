<form
  method="post"
  action="{{ request.path }}"
  hx-post="{{ request.path }}"
  hx-target="#cargo-edit-dialog"
  hx-swap="innerHTML"
  class="flex flex-col gap-6"
>
  {% csrf_token %}
  <section aria-labelledby="deadline-dialog-heading" class="rounded-box rounded-lg border border-base-300 border-slate-300 bg-white p-6 shadow-sm">
    <h2 id="deadline-dialog-heading" class="mb-4 text-xl font-semibold">Change arrival deadline</h2>
    <p class="mb-4">
      {{ cargo.route_specification.origin.name }} to {{ cargo.route_specification.destination.name }}
    </p>
    <label class="label mb-1 block font-medium text-slate-800" for="deadline">Arrival deadline</label>
    {% if deadline_error %}
      <p class="mb-2 text-red-700" id="deadline-error" role="alert">{{ deadline_error }}</p>
    {% endif %}
    <input
      class="input input-bordered w-full rounded-md border border-slate-300 bg-white px-3 py-2 focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-blue-600"
      type="date"
      id="deadline"
      name="deadline"
      value="{{ deadline_value }}"
      {% if deadline_error %}aria-describedby="deadline-error"{% endif %}
      {% if deadline_error %}aria-invalid="true"{% endif %}
      required
    >
  </section>
  <nav aria-label="Deadline dialog actions" class="flex justify-end gap-3">
    <button class="btn btn-ghost min-h-11 rounded-md px-5 py-2 font-semibold text-slate-800 hover:bg-slate-100" type="submit" name="action" value="cancel">Cancel</button>
    <button class="btn btn-primary min-h-11 rounded-md bg-blue-700 px-5 py-2 font-semibold text-white hover:bg-blue-800" type="submit" name="action" value="update">Update</button>
  </nav>
</form>

<form
  method="post"
  action="{{ form_action }}"
  hx-post="{{ form_action }}"
  hx-target="#booking-dialog-content"
  hx-swap="innerHTML"
  class="flex flex-col gap-5"
>
  {% csrf_token %}
  <div>
    <p class="font-medium">Origin: {{ cargo.route_specification.origin.name }}</p>
    <p>Destination: {{ cargo.route_specification.destination.name }} ({{ cargo.route_specification.destination.unlocode.value }})</p>
  </div>
  <div>
    <label class="mb-1 block font-medium" for="deadline">Arrival deadline</label>
    {% if deadline_error %}
      <p class="mb-2 text-red-700" id="deadline-error" role="alert">{{ deadline_error }}</p>
    {% endif %}
    <input
      class="w-full rounded-md border border-slate-300 bg-white px-3 py-2"
      id="deadline"
      name="deadline"
      type="date"
      value="{{ deadline_value }}"
      required
      {% if deadline_error %}aria-invalid="true" aria-describedby="deadline-error"{% endif %}
    >
  </div>
  <div class="flex justify-end gap-3">
    <a class="rounded-md px-4 py-2 hover:bg-slate-100" href="/admin/dashboard/">Cancel</a>
    <button class="rounded-md bg-blue-700 px-4 py-2 font-semibold text-white hover:bg-blue-800" type="submit">Update</button>
  </div>
</form>

<form
  method="post"
  action="/admin/cargo/{{ cargo.tracking_id.value }}/deadline/"
  hx-post="/admin/cargo/{{ cargo.tracking_id.value }}/deadline/"
  hx-target="#cargo-edit-dialog"
  hx-swap="innerHTML"
  class="flex flex-col gap-6"
>
  {% csrf_token %}
  <section aria-labelledby="deadline-dialog-heading">
    <h2 id="deadline-dialog-heading" class="mb-4 text-xl font-semibold">
      Change arrival deadline for cargo {{ cargo.tracking_id.value }}
    </h2>
    <p class="mb-4">
      {{ cargo.route_specification.origin.name }} to {{ cargo.route_specification.destination.name }}
    </p>
    {% if error %}
      <p class="mb-2 text-red-700" id="deadline-error" role="alert">{{ error }}</p>
    {% endif %}
    <label class="mb-1 block font-medium text-slate-800" for="deadline">Arrival deadline</label>
    <input
      class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-blue-600"
      id="deadline"
      name="deadline"
      type="date"
      value="{{ deadline_value }}"
      required
      autofocus
      {% if error %}aria-invalid="true" aria-describedby="deadline-error"{% endif %}
    >
  </section>
  <nav aria-label="Dialog actions" class="flex justify-end gap-3">
    <a class="rounded-md px-5 py-2 font-semibold text-slate-800 hover:bg-slate-100 focus-visible:ring-2 focus-visible:ring-blue-600" href="/admin/dashboard/">Cancel</a>
    <button class="min-h-11 rounded-md bg-blue-700 px-5 py-2 font-semibold text-white hover:bg-blue-800 focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-blue-600" type="submit">
      Update deadline
    </button>
  </nav>
</form>

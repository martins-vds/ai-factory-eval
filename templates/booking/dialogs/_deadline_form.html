<h2 id="dialog-title" class="mb-4 text-xl font-semibold text-slate-900">Change arrival deadline</h2>
<p class="mb-2 text-slate-700">Origin: {{ origin.name }} ({{ origin.unlocode.value }})</p>
<p class="mb-4 text-slate-700">Destination: {{ destination.name }} ({{ destination.unlocode.value }})</p>
<form
  method="post"
  action="{{ action }}"
  hx-post="{{ action }}"
  hx-target="#booking-dialog-content"
  class="flex flex-col gap-4"
>
  {% csrf_token %}
  <label class="label mb-1 block font-medium text-slate-800" for="deadline">Arrival deadline</label>
  {% if deadline_error %}
    <p id="deadline-error" class="text-red-700" role="alert">{{ deadline_error }}</p>
  {% endif %}
  <input
    id="deadline"
    name="deadline"
    type="text"
    value="{{ deadline_value }}"
    class="input input-bordered w-full rounded-md border border-slate-300 bg-white px-3 py-2 focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-blue-600"
    {% if deadline_error %}aria-invalid="true" aria-describedby="deadline-error"{% endif %}
  >
  <div class="flex justify-end gap-3">
    <button class="btn btn-primary min-h-11 rounded-md bg-blue-700 px-5 py-2 font-semibold text-white hover:bg-blue-800" type="submit">Update</button>
    <a class="btn btn-ghost min-h-11 rounded-md px-5 py-2 font-semibold text-slate-800 hover:bg-slate-100" href="/admin/dashboard/">Cancel</a>
  </div>
</form>

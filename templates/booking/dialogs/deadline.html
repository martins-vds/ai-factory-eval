<form
  method="post"
  action="/admin/cargo/{{ cargo.tracking_id.value }}/deadline/"
  hx-post="/admin/cargo/{{ cargo.tracking_id.value }}/deadline/"
  hx-target="#cargo-edit-dialog-content"
  hx-swap="innerHTML"
  class="space-y-5"
>
  {% csrf_token %}
  <h2 id="cargo-edit-dialog-title" class="text-xl font-semibold text-slate-900">
    Change arrival deadline for cargo {{ cargo.tracking_id.value }}
  </h2>
  <p>
    {{ cargo.route_specification.origin.name }} to
    {{ cargo.route_specification.destination.name }}
  </p>
  <label class="block font-medium" for="arrival-deadline">Arrival deadline</label>
  <input
    id="arrival-deadline"
    name="deadline"
    type="date"
    value="{{ deadline_value }}"
    {% if deadline_error %}aria-describedby="deadline-error" aria-invalid="true"{% endif %}
    class="input input-bordered w-full focus-visible:ring-2 focus-visible:ring-blue-600"
  >
  {% if deadline_error %}
    <p id="deadline-error" role="alert" class="text-red-700">{{ deadline_error }}</p>
  {% endif %}
  <div class="flex justify-end gap-3">
    <button type="submit" class="btn btn-primary min-h-11 focus-visible:ring-2 focus-visible:ring-blue-600">
      Update
    </button>
  </div>
</form>
<form method="dialog" class="mt-3 flex justify-end">
  <button type="submit" class="btn btn-ghost min-h-11 focus-visible:ring-2 focus-visible:ring-blue-600">
    Cancel
  </button>
</form>

<section class="w-full max-w-lg rounded-lg bg-white p-6 shadow-xl">
  <h2 id="deadline-dialog-title" class="mb-4 text-xl font-semibold text-slate-900">Change arrival deadline</h2>
  <dl class="mb-4">
    <dt class="font-medium">Origin</dt>
    <dd>{{ cargo.route_specification.origin.name }}</dd>
    <dt class="mt-2 font-medium">Destination</dt>
    <dd>{{ cargo.route_specification.destination.name }}</dd>
  </dl>
  <form
    method="post"
    action="/admin/cargo/{{ cargo.tracking_id.value }}/deadline/"
    hx-post="/admin/cargo/{{ cargo.tracking_id.value }}/deadline/"
    hx-target="#cargo-edit-dialog"
    hx-swap="innerHTML"
    class="flex flex-col gap-4"
  >
    {% csrf_token %}
    <div>
      <label for="arrival-deadline" class="mb-1 block font-medium">Arrival deadline</label>
      <input
        id="arrival-deadline"
        name="deadline"
        type="date"
        value="{{ deadline_value }}"
        required
        {% if error %}aria-describedby="deadline-error" aria-invalid="true"{% endif %}
        class="input input-bordered w-full"
      >
      {% if error %}
        <p id="deadline-error" role="alert" class="mt-2 text-red-700">{{ error }}</p>
      {% endif %}
    </div>
    <div class="flex justify-end gap-3">
      <button type="submit" class="btn btn-primary min-h-11 rounded-md bg-blue-700 px-5 py-2 font-semibold text-white hover:bg-blue-800">
        Update
      </button>
    </div>
  </form>
  <form method="dialog" class="mt-3 flex justify-end">
    <button type="submit" class="btn btn-ghost min-h-11 rounded-md px-5 py-2 font-semibold text-slate-800 hover:bg-slate-100">
      Cancel
    </button>
  </form>
</section>

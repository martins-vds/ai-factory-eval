<header>
  <h2 id="cargo-edit-dialog-heading" class="mb-4 text-xl font-semibold text-slate-900">
    Change arrival deadline
  </h2>
  <p class="mb-4">
    {{ cargo.route_specification.origin.name }} to
    {{ cargo.route_specification.destination.name }}
  </p>
</header>
<form
  method="post"
  action="/admin/cargo/{{ cargo.tracking_id.value }}/deadline/"
  hx-post="/admin/cargo/{{ cargo.tracking_id.value }}/deadline/"
  hx-target="#cargo-edit-dialog"
  hx-swap="innerHTML"
  hx-on::after-request="if (event.detail.successful) this.closest('dialog').close()"
  class="flex flex-col gap-4"
>
  {% csrf_token %}
  <label for="deadline" class="font-medium">Arrival deadline</label>
  <input
    id="deadline"
    name="deadline"
    type="date"
    value="{{ deadline_value }}"
    required
    {% if deadline_error %}aria-invalid="true" aria-describedby="deadline-error"{% endif %}
    class="input input-bordered w-full"
  >
  {% if deadline_error %}
    <p id="deadline-error" role="alert" class="text-red-700">{{ deadline_error }}</p>
  {% endif %}
  <div class="flex justify-end gap-3">
    <button
      type="button"
      onclick="this.closest('dialog').close()"
      class="btn btn-ghost min-h-11 rounded-md px-5 py-2"
    >Cancel</button>
    <button type="submit" class="btn btn-primary min-h-11 rounded-md px-5 py-2">Update</button>
  </div>
</form>

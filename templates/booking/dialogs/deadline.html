<section aria-labelledby="deadline-dialog-heading" class="flex flex-col gap-5">
  <h2 id="deadline-dialog-heading" class="text-xl font-semibold">Change Arrival Deadline</h2>
  <p>Origin: {{ cargo.route_specification.origin.name }}</p>
  <p>Destination: {{ cargo.route_specification.destination.name }}</p>
  <form
    method="post"
    action="/admin/cargo/{{ cargo.tracking_id.value }}/deadline/"
    hx-post="/admin/cargo/{{ cargo.tracking_id.value }}/deadline/"
    hx-target="#cargo-edit-dialog-content"
    hx-swap="innerHTML"
    hx-on::response-error="document.getElementById('cargo-dialog-request-error').textContent = 'The deadline could not be updated. Please try again.'"
    class="flex flex-col gap-5"
  >
    {% csrf_token %}
    <label class="font-medium" for="deadline">Arrival deadline</label>
    {% if deadline_error %}
      <p class="text-red-700" id="deadline-error" role="alert">{{ deadline_error }}</p>
    {% endif %}
    <input
      class="input input-bordered w-full rounded-md border border-slate-300 bg-white px-3 py-2 focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-blue-600"
      type="date"
      id="deadline"
      name="deadline"
      value="{{ deadline_value }}"
      {% if deadline_error %}aria-invalid="true" aria-describedby="deadline-error"{% endif %}
      required
    >
    {% include "booking/dialogs/_actions.html" %}
  </form>
</section>

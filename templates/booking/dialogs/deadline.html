<dialog id="deadline-dialog" class="modal" aria-labelledby="deadline-heading" aria-modal="true">
  <div class="modal-box">
    <h2 id="deadline-heading" class="text-xl font-semibold">Change arrival deadline</h2>
    <p class="mt-3">Origin: {{ cargo.route_specification.origin.name }}</p>
    <p>Destination: {{ cargo.route_specification.destination.name }}</p>
    <form
      method="post"
      action="/admin/cargo/{{ cargo.tracking_id.value }}/deadline/"
      hx-post="/admin/cargo/{{ cargo.tracking_id.value }}/deadline/"
      hx-target="#cargo-dialog"
      hx-swap="innerHTML"
      hx-on::before-swap="if (event.detail.xhr.status >= 400) event.detail.shouldSwap = true"
      class="mt-6"
    >
      {% csrf_token %}
      <label for="deadline" class="label mb-1 block font-medium">Arrival deadline</label>
      <input
        id="deadline"
        name="deadline"
        type="date"
        value="{{ deadline_value }}"
        min="{{ today|date:'Y-m-d' }}"
        required
        autofocus
        {% if deadline_error %}aria-describedby="deadline-error" aria-invalid="true"{% endif %}
        class="input input-bordered w-full"
      >
      {% if deadline_error %}
        <p id="deadline-error" role="alert" class="mt-2 text-red-700">{{ deadline_error }}</p>
      {% endif %}
      <div class="modal-action">
        <button type="submit" class="btn btn-primary">Update</button>
      </div>
    </form>
    <form method="dialog" class="modal-action">
      <button type="submit" class="btn btn-ghost">Cancel</button>
    </form>
  </div>
</dialog>

<section aria-labelledby="deadline-dialog-title" class="flex flex-col gap-5">
  <h2 id="deadline-dialog-title" class="text-xl font-semibold">
    Change arrival deadline for cargo {{ tracking_id }}
  </h2>
  <p>
    Origin: {{ origin.name }} ({{ origin.unlocode.value }})<br>
    Destination: {{ destination.name }} ({{ destination.unlocode.value }})
  </p>
  <form
    method="post"
    action="/admin/cargo/{{ tracking_id }}/deadline/"
    hx-post="/admin/cargo/{{ tracking_id }}/deadline/"
    hx-target="#booking-edit-dialog-content"
    hx-swap="innerHTML"
    hx-on::before-swap="if (event.detail.xhr.status >= 400) { event.detail.shouldSwap = true; event.detail.isError = false; }"
    class="flex flex-col gap-4"
  >
    {% csrf_token %}
    <label class="label mb-1 block font-medium text-slate-800" for="arrival-deadline">Arrival deadline</label>
    <input
      class="input input-bordered w-full rounded-md border border-slate-300 bg-white px-3 py-2 focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-blue-600"
      id="arrival-deadline"
      name="deadline"
      type="date"
      value="{{ deadline_value }}"
      aria-describedby="{% if deadline_error %}deadline-error{% endif %}"
      {% if deadline_error %}aria-invalid="true"{% endif %}
      required
    >
    {% if deadline_error %}
      <p class="text-red-700" id="deadline-error" role="alert">{{ deadline_error }}</p>
    {% endif %}
    <nav aria-label="Deadline dialog actions" class="flex justify-end gap-3">
      <a
        class="btn btn-ghost min-h-11 rounded-md px-5 py-2 font-semibold text-slate-800 hover:bg-slate-100"
        href="/admin/dashboard/"
        onclick="if (this.closest('dialog')) { event.preventDefault(); this.closest('dialog').close(); }"
      >Cancel</a>
      <button class="btn btn-primary min-h-11 rounded-md bg-blue-700 px-5 py-2 font-semibold text-white hover:bg-blue-800" type="submit">Update</button>
    </nav>
  </form>
</section>

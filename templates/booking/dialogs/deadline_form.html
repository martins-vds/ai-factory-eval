<section class="w-full max-w-xl rounded-lg bg-white p-6 shadow-xl" aria-labelledby="booking-dialog-heading">
  <h2 id="booking-dialog-heading" class="mb-4 text-xl font-semibold text-gray-900">
    Change deadline for cargo {{ cargo.tracking_id.value }}
  </h2>
  <p class="mb-2">Origin: {{ cargo.route_specification.origin.name }}</p>
  <p class="mb-4">Destination: {{ cargo.route_specification.destination.name }}</p>
  <form
    method="post"
    action="/admin/cargo/{{ cargo.tracking_id.value }}/deadline/"
    hx-post="/admin/cargo/{{ cargo.tracking_id.value }}/deadline/"
    hx-target="#booking-dialog-content"
    hx-swap="innerHTML"
    class="flex flex-col gap-5"
  >
    {% csrf_token %}
    <div>
      <label class="mb-1 block font-medium text-slate-800" for="deadline">Arrival deadline</label>
      <input
        class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-blue-600"
        type="date"
        id="deadline"
        name="deadline"
        value="{{ deadline_value }}"
        aria-describedby="{% if error %}deadline-error{% endif %}"
        {% if error %}aria-invalid="true"{% endif %}
        required
      >
      {% if error %}
        <p class="mt-2 text-red-700" id="deadline-error" role="alert">{{ error }}</p>
      {% endif %}
    </div>
    <div class="flex justify-end gap-3">
      <button
        class="min-h-11 rounded-md px-5 py-2 font-semibold text-slate-800 hover:bg-slate-100 focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-blue-600"
        type="submit"
        formmethod="dialog"
      >Cancel</button>
      <button
        class="min-h-11 rounded-md bg-blue-700 px-5 py-2 font-semibold text-white hover:bg-blue-800 focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-blue-600"
        type="submit"
      >Update</button>
    </div>
  </form>
</section>

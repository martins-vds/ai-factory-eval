<dialog id="cargo-not-found-dialog" class="modal" aria-modal="true" aria-labelledby="cargo-not-found-title">
  <div class="modal-box">
    <h2 id="cargo-not-found-title" class="text-xl font-semibold">Cargo not found</h2>
    <p class="mt-2">Cargo with tracking ID {{ tracking_id }} could not be found.</p>
    <form method="dialog" class="modal-action">
      <button type="submit" class="btn btn-primary focus:ring-2 focus:ring-blue-500">
        Close
      </button>
    </form>
  </div>
</dialog>

<h2 id="dialog-title">Change destination</h2>
<p>Origin: {{ origin.name }} ({{ origin.unlocode.value }})</p>
<p>
  Current destination: {{ current_destination.name }} ({{ current_destination.unlocode.value }})
</p>
<form method="post" action="{{ action }}" hx-post="{{ action }}" hx-target="#booking-dialog-content">
  {% csrf_token %}
  <label for="destination">New destination</label>
  {% if destination_error %}
    <p id="destination-error" role="alert">{{ destination_error }}</p>
  {% endif %}
  <select id="destination" name="destination" {% if destination_error %}aria-invalid="true" aria-describedby="destination-error"{% endif %}>
    {% for location in destinations %}
      <option value="{{ location.unlocode.value }}">{{ location.name }} ({{ location.unlocode.value }})</option>
    {% endfor %}
  </select>
  <button type="submit">Update</button>
  <a href="/admin/dashboard/">Cancel</a>
</form>

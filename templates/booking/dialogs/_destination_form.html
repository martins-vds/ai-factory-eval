<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/50 p-4" role="presentation">
  <section
    class="w-full max-w-lg rounded-lg bg-white p-6 shadow-xl"
    role="dialog"
    aria-modal="true"
    aria-labelledby="destination-dialog-title"
  >
    <h2 id="destination-dialog-title" class="mb-4 text-xl font-semibold">Change destination</h2>
    <dl class="mb-4 space-y-2">
      <div>
        <dt class="font-medium">Origin</dt>
        <dd>{{ cargo.route_specification.origin.name }} ({{ cargo.route_specification.origin.unlocode.value }})</dd>
      </div>
      <div>
        <dt class="font-medium">Current destination</dt>
        <dd>{{ cargo.route_specification.destination.name }} ({{ cargo.route_specification.destination.unlocode.value }})</dd>
      </div>
    </dl>
    <form method="post" action="/admin/cargo/{{ cargo.tracking_id.value }}/destination/">
      {% csrf_token %}
      <label class="mb-2 block font-medium" for="destination">New destination</label>
      <select
        class="w-full rounded-md border border-slate-300 bg-white px-3 py-2"
        id="destination"
        name="destination"
        required
      >
        {% for location in destinations %}
          <option value="{{ location.unlocode.value }}"{% if location == selected_destination %} selected{% endif %}>
            {{ location.name }} ({{ location.unlocode.value }})
          </option>
        {% endfor %}
      </select>
      <div class="mt-6 flex justify-end gap-3">
        <button class="min-h-11 rounded-md px-5 py-2 hover:bg-slate-100" type="submit" name="action" value="cancel">Cancel</button>
        <button class="min-h-11 rounded-md bg-blue-700 px-5 py-2 font-semibold text-white hover:bg-blue-800" type="submit" name="action" value="update">Update</button>
      </div>
    </form>
  </section>
</div>

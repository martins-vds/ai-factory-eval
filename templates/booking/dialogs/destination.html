<form class="space-y-5">
  <h2 class="text-xl font-semibold text-slate-900">
    Change destination for cargo {{ cargo.tracking_id.value }}
  </h2>
  <p>
    {{ cargo.route_specification.origin.name }} to
    {{ cargo.route_specification.destination.name }}
  </p>
  <label class="block font-medium" for="destination">Destination</label>
  <select id="destination" name="destination" class="select select-bordered w-full focus-visible:ring-2 focus-visible:ring-blue-600">
    {% for location in destination_options %}
      <option value="{{ location.unlocode.value }}">{{ location.name }} ({{ location.unlocode.value }})</option>
    {% endfor %}
  </select>
</form>

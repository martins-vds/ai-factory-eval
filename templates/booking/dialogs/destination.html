<form
  method="post"
  action="/admin/cargo/{{ cargo.tracking_id.value }}/destination/"
  hx-post="/admin/cargo/{{ cargo.tracking_id.value }}/destination/"
  hx-target="#cargo-edit-dialog"
  hx-swap="innerHTML"
  class="flex flex-col gap-6 p-6"
>
  {% csrf_token %}
  <section aria-labelledby="destination-dialog-heading">
    <h2 id="destination-dialog-heading" class="mb-4 text-xl font-semibold">Change cargo destination</h2>
    <p class="mb-4">
      Origin: {{ cargo.route_specification.origin.name }}.
      Current destination: {{ cargo.route_specification.destination.name }}.
    </p>
    <label class="label mb-1 block font-medium text-slate-800" for="dialog-destination">Destination</label>
    {% if destination_error %}
      <p class="mb-2 text-red-700" id="destination-error" role="alert">{{ destination_error }}</p>
    {% endif %}
    <select
      class="select select-bordered w-full rounded-md border border-slate-300 bg-white px-3 py-2 focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-blue-600"
      id="dialog-destination"
      name="destination"
      required
      {% if destination_error %}aria-invalid="true" aria-describedby="destination-error"{% endif %}
    >
      {% for location in locations %}
        <option value="{{ location.unlocode.value }}">
          {{ location.name }} ({{ location.unlocode.value }})
        </option>
      {% endfor %}
    </select>
  </section>
  <nav aria-label="Destination dialog actions" class="flex justify-end gap-3">
    <a class="btn btn-ghost min-h-11 rounded-md px-5 py-2 font-semibold text-slate-800 hover:bg-slate-100" href="/admin/dashboard/">Cancel</a>
    <button class="btn btn-primary min-h-11 rounded-md bg-blue-700 px-5 py-2 font-semibold text-white hover:bg-blue-800" type="submit">Update destination</button>
  </nav>
</form>

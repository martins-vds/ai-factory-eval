<dialog id="destination-dialog" class="modal" aria-modal="true" aria-labelledby="destination-dialog-title">
  <div class="modal-box">
    <h2 id="destination-dialog-title" class="text-xl font-semibold">Change cargo destination</h2>
    <p class="mt-2">
      Origin: {{ cargo.route_specification.origin.name }} →
      Current destination: {{ cargo.route_specification.destination.name }}
    </p>
    <div class="mt-4">
      <form
        method="post"
        action="/admin/cargo/{{ cargo.tracking_id.value }}/destination-dialog/"
        hx-post="/admin/cargo/{{ cargo.tracking_id.value }}/destination-dialog/"
        hx-target="#cargo-dialog"
        hx-swap="innerHTML"
      >
        {% csrf_token %}
        <label for="destination" class="block font-medium">New destination</label>
        <select
          id="destination"
          name="destination"
          class="select select-bordered mt-1 w-full focus:ring-2 focus:ring-blue-500"
          {% if error %}aria-describedby="destination-error"{% endif %}
          autofocus
        >
          {% for location in destinations %}
            <option value="{{ location.unlocode.value }}">
              {{ location.name }} ({{ location.unlocode.value }})
            </option>
          {% endfor %}
        </select>
        {% if error %}
          <p id="destination-error" class="mt-2 text-sm text-red-700">{{ error }}</p>
        {% endif %}
        <button type="submit" class="btn btn-primary mt-4 focus:ring-2 focus:ring-blue-500">
          Update
        </button>
      </form>
      <form method="dialog" class="inline-block">
        <button type="submit" class="btn btn-ghost mt-4 focus:ring-2 focus:ring-blue-500">
          Cancel
        </button>
      </form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button type="submit" aria-label="Close destination dialog">Close</button>
  </form>
</dialog>

<dialog open aria-labelledby="destination-dialog-title" class="modal">
  <div class="modal-box max-w-xl rounded-lg border border-slate-300 bg-white p-6 shadow-lg">
    <h2 id="destination-dialog-title" class="mb-4 text-xl font-semibold text-slate-900">Change destination</h2>
    {% if error %}
      <p class="mb-3 text-red-700" id="destination-error" role="alert">{{ error }}</p>
    {% endif %}
    <p class="mb-2">Origin: {{ cargo.route_specification.origin.name }}</p>
    <p class="mb-4" id="current-destination">Current destination: {{ cargo.route_specification.destination.name }}</p>
    <form
      method="post"
      action="/admin/cargo/{{ cargo.tracking_id.value }}/destination/"
      hx-post="/admin/cargo/{{ cargo.tracking_id.value }}/destination/"
      hx-target="#booking-dialog"
      hx-swap="innerHTML"
      class="flex flex-col gap-5"
    >
      {% csrf_token %}
      <label class="block font-medium text-slate-800" for="destination">New destination</label>
      <select
        class="select select-bordered w-full rounded-md border border-slate-300 bg-white px-3 py-2 focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-blue-600"
        id="destination"
        name="destination"
        required
        {% if error %}aria-invalid="true" aria-describedby="destination-error"{% endif %}
      >
        {% for location in locations %}
          <option value="{{ location.unlocode.value }}">{{ location.name }} ({{ location.unlocode.value }})</option>
        {% endfor %}
      </select>
      <nav aria-label="Destination dialog actions" class="flex justify-end gap-3">
        <a class="btn btn-ghost min-h-11 rounded-md px-5 py-2 font-semibold text-slate-800 hover:bg-slate-100" href="/admin/dashboard/">Cancel</a>
        <button class="btn btn-primary min-h-11 rounded-md bg-blue-700 px-5 py-2 font-semibold text-white hover:bg-blue-800" type="submit">Update destination</button>
      </nav>
    </form>
  </div>
</dialog>

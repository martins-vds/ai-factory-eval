<dialog class="w-full max-w-lg rounded-md border border-gray-300 p-0 shadow-xl backdrop:bg-black/50" aria-labelledby="destination-dialog-title">
  <div class="space-y-4 p-6">
    <h2 id="destination-dialog-title" class="text-xl font-semibold text-gray-900">Change destination</h2>
    <p class="text-gray-700">Origin: {{ cargo.route_specification.origin.name }}</p>
    <p class="text-gray-700">Current destination: {{ cargo.route_specification.destination.name }}</p>
    <form
      method="post"
      action="/admin/cargo/{{ cargo.tracking_id.value }}/destination/"
      hx-post="/admin/cargo/{{ cargo.tracking_id.value }}/destination/"
      hx-target="#cargo-edit-dialog"
      hx-swap="innerHTML"
    >
      {% csrf_token %}
      <label for="destination" class="block font-medium text-gray-700">New destination</label>
      <select
        id="destination"
        name="destination"
        class="mt-1 min-h-11 w-full rounded-md border border-gray-300 p-2"
        {% if destination_error %}aria-invalid="true" aria-describedby="destination-error"{% endif %}
        required
      >
        <option value="" disabled {% if not destination_value %}selected{% endif %}>Choose a destination</option>
        {% for location in destinations %}
          <option value="{{ location.unlocode.value }}" {% if destination_value == location.unlocode.value %}selected{% endif %}>
            {{ location.name }} ({{ location.unlocode.value }})
          </option>
        {% endfor %}
      </select>
      {% if destination_error %}
        <p id="destination-error" class="text-red-700" role="alert">{{ destination_error }}</p>
      {% endif %}
      <button class="btn btn-primary min-h-11 rounded-md bg-blue-700 px-5 py-2 font-semibold text-white hover:bg-blue-800" type="submit">Update</button>
    </form>
    <form method="dialog">
      <button class="btn btn-ghost min-h-11 rounded-md px-5 py-2 font-semibold text-slate-800 hover:bg-slate-100" type="submit">Cancel</button>
    </form>
  </div>
</dialog>

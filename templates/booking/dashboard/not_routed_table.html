<section
  id="not-routed-cargo"
  aria-labelledby="not-routed-cargo-heading"
  hx-on::response-error="document.getElementById('booking-dialog').textContent = 'Unable to load or save changes. Refresh the page and try again.'; document.getElementById('booking-dialog').setAttribute('role', 'alert')"
>
  <h2 id="not-routed-cargo-heading" class="mb-3 text-xl font-semibold text-gray-900">Not Routed Cargo</h2>
  <div class="overflow-x-auto">
    <table class="w-full border-collapse text-left">
      <thead>
        <tr class="border-b border-gray-300">
          <th scope="col" class="p-3">Tracking ID</th>
          <th scope="col" class="p-3">Origin</th>
          <th scope="col" class="p-3">Destination</th>
          <th scope="col" class="p-3">Deadline</th>
        </tr>
      </thead>
      <tbody id="not-routed-cargo-rows">
        {% include "booking/dialogs/_not_routed_rows.html" %}
      </tbody>
    </table>
  </div>
  <div
    id="booking-dialog"
    role="status"
    aria-live="polite"
    hx-on::before-swap="this.querySelector('dialog[open]')?.close()"
    hx-on::after-swap="this.querySelector('dialog')?.showModal()"
  ></div>
</section>

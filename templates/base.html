{% load static %}
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lending Library{% endblock %}</title>
  <link href="{% static 'css/tailwind.css' %}" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.35/daisyui.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" defer></script>
</head>
<body class="min-h-screen bg-stone-50 text-stone-900">
  <header class="border-b border-stone-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5">
      <a class="font-serif text-xl font-semibold tracking-tight" href="{% url 'loans:ui-list' %}">Lending Library</a>
      <span class="badge badge-outline text-amber-900">Reading room</span>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-6 py-12">
    {% block content %}{% endblock %}
  </main>
</body>
</html>

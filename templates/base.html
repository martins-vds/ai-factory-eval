{% load static %}
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}The Lending Library{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" defer></script>
</head>
<body class="min-h-screen bg-[#f5f0e5] font-serif text-[#2f3428]">
  <header class="border-b border-[#d8cdbb] bg-[#fffdf7]">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-6 px-6 py-5">
      <a class="text-xl font-bold tracking-tight text-[#2f3428] no-underline" href="{% url 'loan-catalog' %}">
        The Lending Library
        <span class="block text-xs font-normal tracking-wide text-[#746e60]">A neighborhood collection</span>
      </a>
      <nav aria-label="Main navigation">
        <a class="btn btn-ghost btn-sm text-[#2f3428]" href="{% url 'loan-catalog' %}">Loans</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-6 py-10 md:py-16">
    {% block content %}{% endblock %}
  </main>
  <footer class="border-t border-[#d8cdbb] px-6 py-6 text-center text-sm text-[#746e60]">
    Books are lent for 14 days.
  </footer>
</body>
</html>

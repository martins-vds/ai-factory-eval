{% load static %}
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":false,"error":true},{"code":"...","swap":false}]}'>
  <title>{% block title %}The Lending Library{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" defer></script>
</head>
<body class="min-h-screen bg-[#f5f0e5] text-[#2f3428]">
  <header class="mx-auto max-w-6xl px-6 pt-8">
    <div class="flex flex-wrap items-center justify-between gap-5 border-b border-[#d8cdbb] pb-5">
      <a class="font-serif text-2xl font-bold tracking-tight text-[#2f3428]" href="/ui/loans/">
        The Lending Library
        <span class="ml-2 hidden text-sm font-normal sm:inline">/ a neighborhood collection</span>
      </a>
      <nav aria-label="Library pages" class="flex gap-2 text-sm">
        <a class="btn btn-ghost btn-sm text-[#2f3428]" href="/ui/loans/">Loans</a>
      </nav>
    </div>
  </header>
  {% block content %}{% endblock %}
</body>
</html>

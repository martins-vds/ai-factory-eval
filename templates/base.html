{% load static %}
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}The Lending Library{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.0.43/dist/full.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"></script>
</head>
<body class="min-h-screen bg-stone-50 text-stone-900">
  <header class="border-b border-stone-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5">
      <a class="font-serif text-xl font-semibold tracking-tight" href="/ui/loans/">The Lending Library</a>
      <a class="btn btn-ghost" href="/ui/loans/">Catalog</a>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-6 py-10 md:py-16">
    {% block content %}{% endblock %}
  </main>
  <footer class="border-t border-stone-200 px-6 py-6 text-center text-sm text-stone-600">
    A quiet place to find your next read.
  </footer>
</body>
</html>

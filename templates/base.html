{% load static %}
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}The Lending Library{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet">
  <link href="{% static 'css/tailwind.css' %}" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"></script>
  <style>
    :root { color-scheme: light; }
    body { min-height: 100vh; background: #f5f0e5; color: #2f3428; }
    a:focus-visible, button:focus-visible { outline: 3px solid #a94e37; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body class="font-serif">
  <header class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 border-b border-[#d8cdbb] px-6 py-5">
    <a class="text-2xl font-bold tracking-tight text-[#2f3428]" href="/ui/loans/">
      The Lending Library <span class="text-sm font-normal">/ a neighborhood collection</span>
    </a>
    <nav aria-label="Library pages" class="flex gap-2 text-sm">
      <a class="btn btn-ghost btn-sm text-[#2f3428]" href="/ui/loans/">Loans</a>
    </nav>
  </header>
  <main class="mx-auto max-w-7xl px-6 py-10">
    {% block content %}{% endblock %}
  </main>
</body>
</html>

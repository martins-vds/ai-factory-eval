{% load static %}
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}The Lending Library{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet">
  <link href="{% static 'css/tailwind.css' %}" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"></script>
</head>
<body class="min-h-screen bg-[#f5f0e5] font-serif text-[#2f3428]">
  <header class="mx-auto max-w-7xl px-6 pt-8">
    <div class="flex flex-wrap items-center justify-between gap-4 border-b border-[#d8cdbb] pb-5">
      <a class="text-2xl font-bold tracking-tight" href="{% url 'ui-loan-list' %}">
        The Lending Library
        <span class="text-sm font-normal">/ a neighborhood collection</span>
      </a>
      <nav aria-label="Library pages" class="flex gap-2 text-sm">
        <a class="btn btn-ghost btn-sm" href="{% url 'ui-loan-list' %}">Loans</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-7xl px-6 py-10" hx-boost="true" hx-target="body" hx-swap="innerHTML">
    {% block content %}{% endblock %}
  </main>
  <footer class="mx-auto max-w-7xl border-t border-[#d8cdbb] px-6 py-6 text-sm text-[#686958]">
    Books travel. Stories stay.
  </footer>
</body>
</html>

{% load static %}
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}The Lending Library{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.8.2/dist/full.css">
  <script defer src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"></script>
</head>
<body class="library-page min-h-screen bg-library-paper text-library-ink">
  <header class="catalog-shell pt-6">
    <div class="flex flex-wrap items-center justify-between gap-4 border-b border-library-line pb-5">
      <a class="text-2xl font-bold tracking-tight text-library-ink" href="/ui/loans/">
        The Lending Library
        <span class="text-sm font-normal">/ a neighborhood collection</span>
      </a>
      <nav aria-label="Library pages" class="flex gap-2 text-sm">
        <a class="btn btn-ghost btn-sm text-library-ink" href="/ui/loans/">Loans</a>
      </nav>
    </div>
  </header>
  {% block content %}{% endblock %}
</body>
</html>

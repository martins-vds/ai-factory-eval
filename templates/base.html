<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}The Lending Library{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/tailwind.css">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"></script>
</head>
<body class="variant-reading-room">
  <header class="prototype-shell pb-3">
    <div class="flex flex-wrap items-center justify-between gap-4 border-b prototype-border pb-5">
      <a class="text-2xl font-bold tracking-tight prototype-ink" href="/ui/loans/">The Lending Library <span class="text-sm font-normal">/ a neighborhood collection</span></a>
      <nav aria-label="Library pages" class="flex gap-2 text-sm">
        <a class="btn btn-ghost btn-sm prototype-ink" href="/ui/loans/">Loans</a>
      </nav>
    </div>
  </header>
  {% block content %}{% endblock %}
</body>
</html>

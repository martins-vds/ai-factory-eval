{% load static %}
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}The Lending Library{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" defer></script>
</head>
<body class="variant-reading-room min-h-screen bg-amber-50 font-serif text-stone-800">
  <header class="mx-auto max-w-7xl px-6 pt-6">
    <div class="flex flex-wrap items-center justify-between gap-4 border-b border-amber-900/20 pb-5">
      <a class="text-2xl font-bold tracking-tight text-stone-800" href="{% url 'ui-loan-list' %}">
        The Lending Library <span class="text-sm font-normal">/ a neighborhood collection</span>
      </a>
      <nav aria-label="Library pages" class="flex gap-2 text-sm">
        <a class="btn btn-ghost btn-sm text-stone-800" href="{% url 'ui-loan-list' %}">Loans</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-7xl px-6 pb-12 pt-6">
    {% block content %}{% endblock %}
  </main>
  <script>
    document.body.addEventListener('htmx:beforeSwap', function (event) {
      if (event.detail.xhr.status >= 400) event.detail.shouldSwap = true;
    });
  </script>
</body>
</html>

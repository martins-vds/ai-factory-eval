harness_version: "0.2.0"
source:
  repo: martins-vds/ai-factory-synthetic-target
  sha: 563c316ed51462b08fd6e58f3781a3c8b2890453
  path: legacy
  stacks: [java-17, jax-rs, grizzly, jpa, h2]
  encoding: UTF-8
target:
  repo: martins-vds/ai-factory-eval
  stacks:
    backend: [python-3.13, django-5]
    frontend: [django-templates]
    data: [postgresql-17]
  architecture:
    style: clean-architecture
    adrs: []
characterization:
  tier: A
  reason: "legacy/run.sh builds and runs successfully, and the live HTTP endpoints were exercised against the pinned source."
graph:
  tool: understand-anything
  commit: 4e6d3299017a7432da15957874992837a315c5b4
  patches: [understand-anything/argument-hint.patch]
  enrich:
    source: [java-ee]
    target: [django]
  require:
    source:
      nodes: [table, page, endpoint]
      edges: [reads_from, writes_to, routes, calls]
    target:
      nodes: [table, endpoint]
      edges: [reads_from, writes_to, routes, calls]
  target_paths: [src]
risk_map:
  exclude: ["*.min.js", "*/generated/*"]
skills:
  source:
    read: [java-docs]
    characterize: [java-junit]
  target:
    patterns: [django-patterns]
    security: [django-security]
    tdd: [django-tdd]
    verify: [django-verification]
    coverage: [pytest-coverage]
  specialists:
    data: [reviewing-oracle-to-postgres-migration, migrating-oracle-to-postgres-stored-procedures, planning-oracle-to-postgres-migration-integration-testing, postgresql-code-review]
gates:
  build: ["python -m compileall -q src", "python manage.py check"]
  idiom: ["ruff check", "ruff format --check"]
  tests: ["pytest -q"]
  crap: ["pytest -q --cov=src --cov-report=lcov:.migration/runs/crap.lcov", "lizard --csv src > .migration/runs/lizard.csv", "python .migration/harness/tools/crap.py .migration/runs/lizard.csv --lcov .migration/runs/crap.lcov --max 30"]
  mutation_changed: ["python .migration/harness/tools/afs-mutation --changed-since origin/main"]
  mutation_full: ["python .migration/harness/tools/afs-mutation --all"]
thresholds:
  crap_max_per_method: 30
  mutation_score_min: 0.8
concurrency:
  max_parallel_workers: 4
  remote_workers: true
context:
  working_budget: 0.45
  soft_limit: 0.6
rtk:
  edition: oss
  version: "1.1.0"
data:
  masking: false
  snapshot_owner: martins-vds
  snapshot_dir: .migration/data/snapshot
  mapping: .migration/data/mapping.yaml
services:
  compose: compose.yaml
  test: [db]
signoff:
  approvers: [martins-vds]
costs:
  billing:
    scope: user
    account: martins-vds
self_heal:
  enabled: false
  max_blocks: 2

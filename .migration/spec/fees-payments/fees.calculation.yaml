capability: fees.calculation
title: Calculate a loan late fee
cases:
  - title: The late-day count, waiver, daily fee, and cap follow the due date
    rule:
      - late-days-use-return-date-or-today
      - fee-waived-through-two-days
      - fee-is-twenty-five-cents-per-late-day
      - fee-capped-at-ten-dollars
    oracle: .migration/references/characterization-SY-05.md
    given:
      clock: "{clock}"
    when:
      http:
        method: GET
        path: /fees/L1
    then:
      status: 200
      text:
        - "Due 2026-01-16, {days_late} day(s) late."
        - "Fee: ${fee}"
    examples:
      columns: [clock, days_late, fee]
      rows:
        - ["2026-01-15", 0, "0.00"]
        - ["2026-01-16", 0, "0.00"]
        - ["2026-01-17", 1, "0.00"]
        - ["2026-01-18", 2, "0.00"]
        - ["2026-01-19", 3, "0.75"]
        - ["2026-01-27", 11, "2.75"]
        - ["2026-02-25", 40, "10.00"]
        - ["2026-02-26", 41, "10.00"]
  - title: A returned loan is measured through its return date
    rule: late-days-use-return-date-or-today
    oracle: .migration/characterization/source/goldens/http.json
    given:
      clock: "2026-11-08"
    when:
      http:
        method: GET
        path: /fees/L3
    then:
      status: 200
      text:
        - "Due 2025-12-15, 19 day(s) late."
        - "Fee: $4.75"

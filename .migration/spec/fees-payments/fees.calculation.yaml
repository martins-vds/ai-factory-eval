capability: fees.calculation
title: Calculate a loan late fee
cases:
  - title: Calculate the fee for an unreturned loan at date boundaries
    rule:
      - late-days-clamped-at-zero
      - two-day-grace-period
      - fee-per-late-day
      - fee-capped-at-ten-dollars
    oracle: .migration/references/characterization-SY-05.md
    given:
      clock: "{today}"
    when:
      http:
        method: GET
        path: /fees/L1
    then:
      status: 200
      text:
        - "Due 2026-01-16, {late_days} day(s) late."
        - "Fee: {fee}"
    examples:
      columns: [today, late_days, fee]
      rows:
        - ["2026-01-15", 0, "$0.00"]
        - ["2026-01-16", 0, "$0.00"]
        - ["2026-01-17", 1, "$0.00"]
        - ["2026-01-18", 2, "$0.00"]
        - ["2026-01-19", 3, "$0.75"]
        - ["2026-02-24", 39, "$9.75"]
        - ["2026-02-25", 40, "$10.00"]
        - ["2026-02-26", 41, "$10.00"]
  - title: Use a returned loan's return date
    rule: returned-date-used
    oracle: .migration/characterization/source/goldens/http.json
    given:
      clock: "2026-11-08"
    when:
      http:
        method: GET
        path: /fees/L3
    then:
      status: 200
      text:
        - "Due 2025-12-15, 19 day(s) late."
        - "Fee: $4.75"

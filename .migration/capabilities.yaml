    /tmp/sy01-source.BG6mQV`, then `cd /tmp/sy01-source.BG6mQV/legacy &&
    PORT=18080 ./run.sh`. OpenJDK 17.0.21 and Maven 3.10.0 were present; the
    script completed `mvn -q -B package -DskipTests` and printed `Lending
    Library listening on 18080`. HTTP probes: GET /loans -> 200 with seeded
    loans; GET /loans/no-such-loan -> 404 `no such loan`; GET /loans/L1 -> 200;
    GET /about -> 200 HTML; GET /fees/no-such-loan -> 404; GET /fees/L2 ->
    200 with Fee $0.00; POST /loans with
    `member=sy01-probe&isbn=9780000000000` -> 201, loan L4 due 2026-12-04;
    POST /loans/L4/return -> 200, returned 2026-11-20; POST
    /payments/no-such-loan -> 404 without calling the gateway. Startup logged
    Jersey provider warnings, but the tested routes served successfully.

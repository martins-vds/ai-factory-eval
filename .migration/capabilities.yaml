  legacy_environment: available
  source_builds: "yes"
  tier: A
  reason: |
    Source commit: 563c316ed51462b08fd6e58f3781a3c8b2890453.
    Build and start, from an extracted scratch copy so legacy/ remains untouched:
      tmpdir=$(mktemp -d /tmp/sy01-legacy.XXXXXX)
      git archive --format=tar 563c316ed51462b08fd6e58f3781a3c8b2890453 legacy | tar -xf - -C "$tmpdir"
      cd "$tmpdir/legacy"; ./run.sh
    Result: exit remained running; Maven package succeeded; Hibernate connected to H2 jdbc:h2:mem:library; server logged "Lending Library listening on 8080".
    Requests and observed status/body:
      GET / -> 404, empty body.
      GET /loans -> 200; three seeded lines:
        L1;ana;9780134685991;2026-01-02;2026-01-16;
        L2;bo;9780596007126;2026-01-10;2026-01-24;2026-01-20
        L3;cy;9781617294945;2025-12-01;2025-12-15;2026-01-03
      GET /loans/L1 -> 200, "L1;ana;9780134685991;2026-01-02;2026-01-16;\n".
      GET /loans/missing -> 404, "no such loan\n".
      GET /fees/L1 -> 200, HTML reported 307 days late and Fee: $10.00.
      GET /fees/missing -> 404, "<p>No such loan.</p>".
      GET /about -> 200, HTML title "About the Lending Library".
      POST /loans with member=pat and isbn=9780000000000 -> 201,
        "L4;pat;9780000000000;2026-11-19;2026-12-03;\n".
      POST /loans/L1/return -> 200,
        "L1;ana;9780134685991;2026-01-02;2026-01-16;2026-11-19\n".
      POST /loans/missing/return -> 404, "no such loan\n".
      POST /payments/missing -> 404, "no such loan\n".
      POST /loans with no form body -> 500, Grizzly "Request failed" HTML (1031 bytes);
        this differs from LoanResource's explicit null-input 400 branch and is drafted as a quirk.
    The valid-payment gateway call was not exercised; its default URL is an external .invalid host.

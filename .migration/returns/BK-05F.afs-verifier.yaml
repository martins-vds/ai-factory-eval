  - "#10, #13, #27 and #46 alter Http404 messages. Production DEBUG=false renders the same generic 404; debug-mode diagnostic text changes, so these are not universally equivalent."
  - "#14 adds X to quote's safe set; X is already an unreserved character, so the redirect is unchanged."
  - "#40 changes the missing token fallback from empty to XXXX; both fail signature validation and produce 404."
  - "#44 changes a BadSignature message that is caught and replaced by the same Http404."

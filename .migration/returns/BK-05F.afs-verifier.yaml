review:
  - "The four BK-05F ledger entries identify the target components and tests. BookingServiceTest was not executed in the legacy Arquillian environment; its transcribed contracts are not evidence of an executed source test."
  - "The route-candidates source observation used randomized service results; target tests assert endpoint and deadline properties rather than exact random routes. Rulings #89 and #238 preserve generation without a deadline followed by filtering."
  - "The source select-itinerary page was blank with candidates; ruling #252 approves rendering those candidates. The target populated and empty cases are asserted."
  - "Source assignment reached show.xhtml; ruling #236 requires the target cargo-details redirect. The selected itinerary and ROUTED state are asserted."
  - "Ruling #232 replaces the source's unknown-ID failure with a cargo-not-found 404. Status is verified for both screens and assignment; the inherited generic production 404 does not identify cargo."
  - "The normal POST form does not use htmx. Unknown cargo, invalid or cross-cargo tokens and expired candidates return 404; unsupported methods return 405. These render full responses, not htmx fragments."
  - "The profile mutation command uses origin/main, which already contains the production implementation in this evaluation checkout and therefore returns n/a. The additional explicit-path mutation run examines the route-selection implementation; see its journal row and .migration/evidence/mutants/BK-05F.md for diffs."
  - "The explicit-path mutation run final2-mutation-route-selection scored 0.855: 53 killed and 9 survived."
  - "The profile UI check sees zero changed templates against origin/main. The supplementary ui-original-implementation run checked all three route-selection templates against their original implementation baseline and reported no findings."
  - "The agent-browser CLI was unavailable, and the project's URL configuration does not yet register these screens (BK-05H owns that wiring). The screen flows were exercised with Django's request/response client and a test URL configuration, not visually checked in a browser."
mutation_survivors:

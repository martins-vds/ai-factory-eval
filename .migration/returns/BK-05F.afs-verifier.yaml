    enforced: true
    ledger_rule: route-candidate-valid
  - capability: booking.routing-assign
    rule: The selected itinerary must satisfy the cargo's current route specification before assignment.
    use_case: CargoRouting.assign_route
    test: tests/booking/interfaces/test_route_selection.py::test_assign_route_refuses_candidate_that_misses_current_deadline
    enforced: false
    ledger_rule: route-specification-satisfied
  - capability: booking.routing-assign
    rule: A valid selected itinerary is persisted and the cargo's route state is recalculated.
    use_case: CargoRouting.assign_route
    test: tests/booking/application/test_routing.py::test_assign_route_persists_itinerary_and_recalculates_delivery
    enforced: true

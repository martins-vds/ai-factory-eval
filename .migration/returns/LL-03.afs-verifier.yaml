    rule: "A returned loan's return date, rather than today, determines its late days."
    use_case: FeeApplication.fee_for
    test: tests/fees/test_fee_calculation.py::test_fee_for_returned_loan_uses_return_date_instead_of_today
    enforced: true
  - capability: fees.calculation
    rule: "An unknown loan has no calculated fee."
    use_case: FeeApplication.fee_for
    test: tests/fees/test_fee_calculation.py::test_fee_for_unknown_loan_returns_none
    enforced: true
  - capability: integration.payment-gateway
    rule: "An unknown loan is refused before the payment gateway is called."
    use_case: FeeApplication.pay
    test: tests/fees/test_fee_services.py::test_fee_pay_refuses_unknown_loan_without_calling_gateway
    enforced: true
  - capability: integration.payment-gateway
    rule: "An existing loan's payment is delegated to the gateway and its response is returned."
    use_case: FeeApplication.pay
    test: tests/fees/test_fee_services.py::test_fee_pay_calls_gateway_for_existing_loan_and_returns_response
    enforced: true
no_rules:

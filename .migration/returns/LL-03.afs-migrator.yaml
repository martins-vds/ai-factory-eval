    rule: Only gateway HTTP 200 remains 200; other responses become 502 with the response body preserved.
    use_case: FeeApplication.pay
    test: tests/fees/test_services.py::test_payment_maps_only_gateway_success_to_success
    enforced: true
    ledger_rule: gateway-status
  - capability: integration.payment-gateway
    rule: I/O and interrupted gateway failures become 502 while preserving the original exception cause.

    enforced: true
    ledger_rule: gateway-success
  - capability: integration.payment-gateway
    rule: Every non-200 gateway response becomes HTTP 502 while preserving its body.
    use_case: PaymentApplication.pay
    test: tests/fees/test_services.py::test_non_success_gateway_response_becomes_bad_gateway
    enforced: true
    ledger_rule: gateway-failure
  - capability: integration.payment-gateway

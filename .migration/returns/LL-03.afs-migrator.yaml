    ledger_rule: late-fee-amount
  - capability: fees.page
    rule: An unknown loan has no fee quote.
    use_case: src.fees.services.FeeApplication.calculate
    test: tests/fees/test_fee_services.py::test_fee_calculation_uses_return_date_and_returns_no_fee_for_unknown_loan
    enforced: true
    ledger_rule: missing-loan
  - capability: integration.payment-gateway
    rule: Reject an unknown loan before making a payment-gateway request.
    use_case: src.fees.services.PaymentApplication.pay
    test: tests/fees/test_fee_services.py::test_payment_requires_an_existing_loan_before_calling_gateway
    enforced: true
    ledger_rule: loan-required
  - capability: integration.payment-gateway
    rule: Return gateway HTTP 200 as 200 and map every other gateway status to 502 while preserving its body.
    use_case: src.fees.services.PaymentApplication.pay
    test: tests/fees/test_fee_services.py::test_payment_maps_gateway_status_and_preserves_its_response_body
    enforced: true
    ledger_rule: gateway-status
  - capability: integration.payment-gateway
    rule: Map gateway I/O failures to HTTP 502 with the payment-gateway-unavailable body.
    use_case: src.fees.services.PaymentApplication.pay
    test: tests/fees/test_fee_services.py::test_payment_maps_transport_failures_to_gateway_unavailable
    enforced: true
    ledger_rule: gateway-failure
  - capability: integration.payment-gateway
    rule: Surface an interrupted payment call as a 502 gateway failure while retaining the interruption.
    use_case: src.fees.services.PaymentApplication.pay
    test: tests/fees/test_fee_services.py::test_payment_maps_transport_failures_to_gateway_unavailable
    enforced: true
    ledger_rule: preserve-interruption

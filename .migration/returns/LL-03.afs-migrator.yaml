rules:
  - capability: fees.calculation
    rule: Late days use returned_on or today's date and are clamped to zero.
    use_case: FeeApplication.calculate_fee
    test: tests/fees/test_fee_services.py::test_calculate_fee_applies_waiver_threshold_and_cap
    enforced: true
    ledger_rule: days-late
  - capability: fees.calculation
    rule: Fees are zero through two days late; otherwise charge 25 cents for every late day.
    use_case: FeeApplication.calculate_fee
    test: tests/fees/test_fee_services.py::test_calculate_fee_applies_waiver_threshold_and_cap
    enforced: true
    ledger_rule: fee-threshold-and-rate
  - capability: fees.calculation
    rule: The calculated fee cannot exceed $10.
    use_case: FeeApplication.calculate_fee
    test: tests/fees/test_fee_services.py::test_calculate_fee_applies_waiver_threshold_and_cap
    enforced: true
    ledger_rule: fee-cap
  - capability: fees.page
    rule: An unknown loan has no fee quote.
    use_case: FeeApplication.calculate_fee
    test: tests/fees/test_fee_services.py::test_fee_calculation_returns_none_for_unknown_loan
    enforced: true
    ledger_rule: unknown-loan
  - capability: integration.payment-gateway
    rule: A payment is not sent to the gateway unless the loan exists.
    use_case: FeeApplication.pay
    test: tests/fees/test_fee_services.py::test_payment_requires_an_existing_loan_before_calling_gateway
    enforced: true
    ledger_rule: existing-loan
  - capability: integration.payment-gateway
    rule: Only gateway HTTP 200 remains 200; every other response maps to 502 with its body preserved.
    use_case: FeeApplication.pay
    test: tests/fees/test_fee_services.py::test_payment_maps_non_success_gateway_responses_to_bad_gateway
    enforced: true
    ledger_rule: gateway-status
  - capability: integration.payment-gateway
    rule: An interrupted gateway call remains an interruption with its original cause and surfaces as HTTP 502.
    use_case: FeeApplication.pay
    test: tests/fees/test_fee_services.py::test_payment_does_not_swallow_interruption
    enforced: true
    ledger_rule: interruption

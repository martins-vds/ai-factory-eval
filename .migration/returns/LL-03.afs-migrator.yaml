    use_case: FeeApplication.fee_for
    test: tests/fees/test_fee_services.py::test_fee_for_loan_observes_grace_period_and_cap
    enforced: true
    ledger_rule: fee-waiver-cap
  - capability: fees.page
    rule: An unknown loan has no fee quote.
    use_case: FeeApplication.fee_for
    test: tests/fees/test_fee_services.py::test_fee_for_unknown_loan_returns_no_quote
    enforced: true
    ledger_rule: loan-exists
  - capability: integration.payment-gateway
    rule: An unknown loan returns 404 and must not be sent to the payment gateway.
    use_case: PaymentApplication.pay
    test: tests/fees/test_fee_services.py::test_payment_for_unknown_loan_does_not_call_gateway
    enforced: true
    ledger_rule: loan-exists
  - capability: integration.payment-gateway
    rule: Gateway HTTP 200 remains 200; all other HTTP responses return 502.
    use_case: PaymentApplication.pay
    test: tests/fees/test_fee_services.py::test_payment_maps_gateway_status_and_preserves_response_body
    enforced: true
    ledger_rule: gateway-status
  - capability: integration.payment-gateway
    rule: Gateway I/O failures return HTTP 502 with the unavailable message.
    use_case: PaymentApplication.pay
    test: tests/fees/test_fee_services.py::test_gateway_io_failure_becomes_a_502_payment_result
    enforced: true
    ledger_rule: gateway-io-failure
  - capability: integration.payment-gateway
    rule: An interrupted gateway call returns 502 while retaining the original InterruptedError.
    use_case: PaymentApplication.pay
    test: tests/fees/test_fee_services.py::test_interrupted_payment_is_a_gateway_failure_and_retains_interruption
    enforced: true
    ledger_rule: retain-interruption

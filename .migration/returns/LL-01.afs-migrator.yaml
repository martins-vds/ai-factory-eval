role: afs-migrator
ticket: LL-01
issue: martins-vds/ai-factory-eval#2354
pr: https://github.com/martins-vds/ai-factory-eval/pull/2357
gates:
  build: 0
  behavior: 0
  idiom: 0
  crap: 0
  mutation_changed: 0.986
  regression: 0
evidence_logs:
  - .migration/evidence/runs/LL-01.md
ledger_updated:
  - application.build
  - application.startup
  - data.loan-storage
  - data.seed-records
  - repository.transactions
  - loan.due-date
  - loan.get
  - loan.list
  - loan.text-export
quirk_tickets:
  - martins-vds/ai-factory-synthetic-target#42
  - martins-vds/ai-factory-synthetic-target#43
new_tickets: []
handoff: none
rules:
  - capability: data.loan-storage
    rule: Startup migrations preserve stored loan records instead of replacing them with seed values.
    use_case: LoanCatalog.get
    test: tests/loans/test_repository.py::test_persisted_catalog_is_not_reseeded_after_database_reconnect
    enforced: true
    ledger_rule: preserve-persisted-loans
  - capability: data.seed-records
    rule: An empty database contains the characterized L1, L2, and L3 example loans with their exact values.
    use_case: LoanCatalog.all
    test: tests/loans/test_services.py::test_catalog_use_case_returns_the_seed_records_in_id_order
    enforced: true
    ledger_rule: seed-example-loans
  - capability: loan.due-date
    rule: A loan is due exactly 14 calendar days after its lent-on date.
    use_case: Loan.due_on
    test: tests/loans/test_services.py::test_due_date_is_fourteen_calendar_days_after_lending
    enforced: true
    ledger_rule: fourteen-calendar-days
  - capability: loan.get
    rule: An unknown loan identifier resolves to no loan, producing the characterized 404 at the HTTP boundary.
    use_case: LoanCatalog.get
    test: tests/loans/test_services.py::test_catalog_use_case_returns_no_loan_for_an_unknown_identifier
    enforced: true
    ledger_rule: unknown-loan-not-found
  - capability: loan.list
    rule: Catalog listing returns every loan in lexicographic identifier order.
    use_case: LoanCatalog.all
    test: tests/loans/test_services.py::test_catalog_use_case_orders_ids_lexically
    enforced: true
    ledger_rule: order-by-identifier
  - capability: loan.text-export
    rule: Each exported row has six fields in id, member, ISBN, lent-on, due-on, returned-on order, ISO dates, an empty missing return date, and a trailing newline.
    use_case: LoanCatalog.text_export
    test: tests/loans/test_services.py::test_catalog_use_case_text_export_escapes_delimiters_and_line_breaks
    enforced: true
    ledger_rule: six-field-text-format
  - capability: loan.text-export
    rule: Spreadsheet export quotes field values containing semicolons, quotes, or line breaks.
    use_case: LoanCatalog.text_export
    test: tests/loans/test_services.py::test_catalog_use_case_text_export_escapes_delimiters_and_line_breaks
    enforced: true
    ledger_rule: escape-delimiter-fields
no_rules:
  application.build: Build and packaging configuration has no application business rules.
  application.startup: Startup binding and command behavior are operational concerns, not application business rules.
  repository.transactions: Transaction and rollback boundaries are persistence infrastructure, not application business rules.

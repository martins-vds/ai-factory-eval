role: afs-migrator
ticket: LL-01
issue: martins-vds/ai-factory-eval#2342
pr: https://github.com/martins-vds/ai-factory-eval/pull/2345
# Refreshed after the repository.py change from the build-*, behavior-*, idiom-*, crap-*, and mutation_changed-* afs-run rows: build=0, behavior=0, idiom=0, crap=0, mutation_changed=1.000, regression=0.
gates:
  build: 0
  behavior: 0
  idiom: 0
  crap: 0
  mutation_changed: 1.0
  regression: 0
evidence_logs:
  - .migration/evidence/runs/LL-01.md
ledger_updated:
  - application.build
  - application.startup
  - data.loan-storage
  - data.seed-records
  - repository.transactions
  - loan.due-date
  - loan.get
  - loan.list
  - loan.text-export
quirk_tickets:
  - martins-vds/ai-factory-synthetic-target#42
  - martins-vds/ai-factory-synthetic-target#43
new_tickets: []
handoff: none
rules:
  - capability: data.loan-storage
    rule: Previously stored loan records remain available after repeated startup migrations and are not overwritten by seed values.
    use_case: LoanCatalog.get_loan
    test: tests/loans/test_catalog.py::test_catalog_use_case_reads_persisted_data_after_a_repeated_migration
    enforced: true
    ledger_rule: preserve-persisted-loans
  - capability: data.seed-records
    rule: An empty catalog starts with L1, L2, and L3 using the characterized member, ISBN, and date values.
    use_case: LoanCatalog.list_loans
    test: tests/loans/test_catalog.py::test_catalog_use_case_exposes_the_characterized_seed_records
    enforced: true
    ledger_rule: seed-characterized-loans
  - capability: loan.due-date
    rule: A loan due date is exactly 14 calendar days after its lending date.
    use_case: LoanCatalog.list_loans
    test: tests/loans/test_catalog.py::test_catalog_use_case_orders_loans_and_calculates_due_dates
    enforced: true
    ledger_rule: due-fourteen-days
  - capability: loan.get
    rule: An unknown loan ID is rejected as not found.
    use_case: LoanCatalog.get_loan
    test: tests/loans/test_catalog.py::test_catalog_use_case_rejects_an_unknown_loan
    enforced: true
    ledger_rule: unknown-loan-not-found
  - capability: loan.list
    rule: Catalog results are ordered by loan ID.
    use_case: LoanCatalog.list_loans
    test: tests/loans/test_catalog.py::test_catalog_use_case_orders_loans_and_calculates_due_dates
    enforced: true
    ledger_rule: loans-ordered-by-id
  - capability: loan.text-export
    rule: Text exports keep the characterized field order and escape field or record delimiter characters so every record parses back to its fields.
    use_case: LoanCatalog.export_loans
    test: tests/loans/test_catalog.py::test_catalog_use_case_escapes_export_delimiters
    enforced: true
    ledger_rule: escaped-delimited-export
no_rules:
  application.build: Build wiring adds no business input validation or domain policy.
  application.startup: Startup wiring is infrastructure behavior, not business policy.
  repository.transactions: Transaction boundaries are persistence infrastructure, not business policy.

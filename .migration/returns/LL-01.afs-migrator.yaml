rules:
  - capability: loan.due-date
    rule: Every loan is due 14 calendar days after lent_on.
    use_case: src.loans.services.due_date
    test: tests/loans/test_catalog.py::test_due_date_is_fourteen_calendar_days_after_lent_date
    enforced: true
    ledger_rule: fourteen-calendar-days
  - capability: loan.get
    rule: A lookup for an absent loan ID returns no loan.
    use_case: src.loans.repository.LoanRepository.get
    test: tests/loans/test_catalog.py::test_repository_refuses_absent_lookup
    enforced: true
    ledger_rule: unknown-loan-not-found
  - capability: loan.list
    rule: The loan list contains every loan ordered by ID.
    use_case: src.loans.repository.LoanRepository.list
    test: tests/loans/test_catalog.py::test_repository_returns_loans_in_id_order
    enforced: true
    ledger_rule: ordered-trailing-newline
  - capability: loan.text-export
    rule: Export semicolon and newline delimiter characters in loan fields.
    use_case: src.loans.services.format_loan
    test: tests/loans/test_catalog.py::test_export_escapes_delimiter_characters
    enforced: true
    ledger_rule: escaped-semicolon-fields

no_rules:
  booking.dashboard-chain: Dashboard composition is structural wiring and carries no business rule.
  booking.dashboard-filters: The three lists are a presentation projection of existing cargo state; no eligibility, limit, or state transition is introduced.
  booking.screen-dashboard: This capability specifies page layout and table order only.
  booking.screen-routed-table: This capability renders existing cargo fields and links; routing policy is handled elsewhere.
  booking.screen-not-routed-table: This capability renders rows and route links; destination/deadline editing policy belongs to BK-05G.
  booking.screen-claimed-table: This capability renders claimed-cargo fields and the approved details link; it has no business rule.
  booking.screen-cargo-details: This capability renders existing route state and links; it does not change cargo state.
  booking.cargo-not-found: Returning HTTP 404 for an absent record is adapter-level error mapping approved by ruling #232, not a domain business rule.

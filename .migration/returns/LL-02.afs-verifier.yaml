rules:
  - capability: loan.lend
    rule: Reject blank member and ISBN values before creating a loan.
    use_case: src.loans.services.lend_loan
    test: tests/loans/test_catalog.py::test_lend_use_case_rejects_blank_member_and_isbn
    enforced: false
  - capability: loan.return-date
    rule: Reject a repeated return and preserve the original returned_on date.
    use_case: src.loans.services.return_loan
    test: tests/loans/test_catalog.py::test_return_use_case_rejects_repeated_return_without_replacing_date
    enforced: true
no_rules:
  loan.return: The capability specifies HTTP status/body mapping; its state-transition rule is recorded under loan.return-date.

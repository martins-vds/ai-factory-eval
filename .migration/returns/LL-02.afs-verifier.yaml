findings:
  - severity: major
    where: src/loans/services.py:9
    what: lend_loan accepts and persists blank or whitespace member/ISBN values instead of refusing them at the use-case boundary.
    evidence: tests/loans/test_catalog.py::test_lend_use_case_rejects_blank_member_and_isbn
  - severity: major
    where: src/loans/services.py:4
    what: The use case imports Django's clock and concrete LoanRepository, violating the profile's port-only dependency contract.
    evidence: "run: verifier-final-idiom"
  - severity: major
    where: templates/loans/detail.html:25
    what: The return form has no htmx 4xx/5xx response handling; an unknown-loan 404 is not swapped into the page.
    evidence: "run: verifier-final-ui"
  - severity: minor
    where: templates/loans/new.html:6
    what: The changed reading-room templates use Tailwind utilities absent from static/css/tailwind.css, degrading the selected UI layout (14 CSS findings).
    evidence: "run: verifier-final-ui"
  - severity: minor
    where: src/loans/services.py:12
    what: Loan IDs use count()+1 before a separate insert, so concurrent lending requests can select the same ID and one can fail.
  - severity: minor
    where: .migration/evidence/mutants/LL-02.md:5
    what: "The last successful mutation run left 9 behavior-changing survivors: views #1/#2 (catalog template/context), #44 (HTMX/full-page selection), #68-#70 (unknown-return response), #79 (repeat-return context), URL #4 (catalog route), and form #9 (model). The final mutation rerun could not assess whether new tests kill some of them."
    evidence: "run: verifier-mutation-changed-baseline"
tests_added:
  - tests/loans/test_catalog.py::test_lend_endpoint_rejects_missing_or_blank_fields
  - tests/loans/test_catalog.py::test_lend_use_case_rejects_blank_member_and_isbn
  - tests/loans/test_catalog.py::test_return_use_case_rejects_repeated_return_without_replacing_date
  - tests/loans/test_catalog.py::test_browser_lending_page_shows_errors_for_blank_fields
  - tests/loans/test_catalog.py::test_browser_return_page_returns_not_found_for_unknown_loan
  - tests/loans/test_catalog.py::test_browser_regular_repeat_return_shows_an_error
ledger_issues:
  - loan.lend.yaml, loan.return-date.yaml, and loan.return.yaml omit both rules and no_rules despite encoding behavioral rules in their boundaries.
  - loan.return-date.yaml does not cite the new direct use-case test for repeated-return preservation.

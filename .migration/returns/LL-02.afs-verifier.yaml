  - severity: major
    where: templates/loans/loan-form.html:2-17
    what: "LL-02 lending and return templates reference Tailwind utilities absent from static/css/tailwind.css, so their intended spacing and custom button colors do not render."
    evidence: "run: ui-check-verify"
  - severity: minor
    where: src/loans/repository.py:20-21
    what: "The repository owns the repeated-return lifecycle decision instead of delegating that domain transition to domain policy."
  - severity: minor
    where: src/loans/services.py:11-13
    what: "Loan ids are count-derived before create; concurrent lends can select the same id. The source also derives ids by count, and concurrency was not characterized, so this is not a verified fidelity divergence."

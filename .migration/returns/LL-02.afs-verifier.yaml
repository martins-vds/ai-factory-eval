    where: .migration/evidence/mutants/LL-02.md:1-226
    what: "Material survivors include method guards (#8/#24/#54/#65), routes (#2-#7), LoanForm.Meta.model (#9), transaction.atomic (#2), and return error handling/context (#68-#70/#79). #44 only changes the unused GET-with-HX form variant. The fresh mutation run could not confirm kills because the test baseline fails."

rules:
  - capability: loan.lend
    rule: Member must be nonblank after trimming; otherwise lending is rejected with a field error and no loan is created.
    use_case: LoanUseCases.lend
    test: tests/loans/test_circulation.py::test_lend_use_case_reports_each_blank_field_before_creating_a_loan
    enforced: true
    ledger_rule: member-required
  - capability: loan.lend
    rule: ISBN must be nonblank after trimming; otherwise lending is rejected with a field error and no loan is created.
    use_case: LoanUseCases.lend
    test: tests/loans/test_circulation.py::test_lend_use_case_reports_each_blank_field_before_creating_a_loan
    enforced: true
    ledger_rule: isbn-required
  - capability: loan.lend
    rule: A new loan uses today's date in the server's default time zone.
    use_case: LoanUseCases.lend
    test: tests/loans/test_circulation.py::test_lend_use_case_uses_the_clock_date
    enforced: true
    ledger_rule: local-lending-date
  - capability: loan.lend
    rule: Lend creates the next L<count+1> identity with a due date 14 calendar days after lending.
    use_case: LoanUseCases.lend
    test: tests/loans/test_circulation.py::test_lend_use_case_creates_a_fourteen_day_loan_with_the_next_identity
    enforced: true
  - capability: loan.lend
    rule: Semicolons, quotes, and line breaks in loan fields are escaped in text exports.
    use_case: loan_line
    test: tests/loans/test_circulation.py::test_loan_line_escapes_field_delimiters_quotes_and_line_breaks
    enforced: true
    ledger_rule: export-escaping
  - capability: loan.lend
    rule: Nonblank member and ISBN values are persisted exactly as submitted.
    use_case: LoanUseCases.lend
    test: tests/loans/test_circulation.py::test_lend_use_case_preserves_surrounding_whitespace_in_nonblank_values
    enforced: false
  - capability: loan.return-date
    rule: A successful first return records today's date in the server's default time zone.
    use_case: LoanUseCases.return_loan
    test: tests/loans/test_circulation.py::test_return_use_case_uses_the_clock_date_for_a_first_return
    enforced: true
    ledger_rule: return-date-is-local-today
  - capability: loan.return-date
    rule: A repeated return is rejected and leaves the original returned_on date unchanged.
    use_case: LoanUseCases.return_loan
    test: tests/loans/test_circulation.py::test_return_use_case_rejects_repeated_return_without_replacing_the_date
    enforced: true
    ledger_rule: preserve-original-return-date
  - capability: loan.return
    rule: Returning an unknown loan is rejected without changing loan state; the view translates absence to the characterized 404 response.
    use_case: LoanUseCases.return_loan
    test: tests/loans/test_circulation.py::test_return_use_case_reports_unknown_loan_without_a_return
    enforced: true
    ledger_rule: unknown-loan
  - capability: loan.return
    rule: Only an unreturned loan can be returned; a repeated return is rejected without changing the saved date.
    use_case: LoanUseCases.return_loan
    test: tests/loans/test_circulation.py::test_return_use_case_rejects_repeated_return_without_replacing_the_date
    enforced: true
    ledger_rule: one-time-return
no_rules: {}

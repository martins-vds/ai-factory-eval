rules:
  - capability: loan.lend
    rule: Lending refuses missing or whitespace-only member and ISBN values.
    use_case: lend_book
    test: tests/loans/test_circulation.py::test_lend_use_case_rejects_blank_fields
    enforced: true
    ledger_rule: nonblank-member-isbn
  - capability: loan.lend
    rule: A valid loan receives id L<count+1> and the supplied current date.
    use_case: lend_book
    test: tests/loans/test_circulation.py::test_lend_use_case_assigns_the_next_id_and_lending_date
    enforced: true
    ledger_rule: next-id-and-lent-date
  - capability: loan.return-date
    rule: The first return records the supplied date; repeated returns are refused without replacing it.
    use_case: return_book
    test: tests/loans/test_circulation.py::test_return_use_case_sets_date_once_and_rejects_a_repeat
    enforced: true
    ledger_rule: return-date-recorded-once
  - capability: loan.return
    rule: A return for an unknown loan is refused and does not create a record.
    use_case: return_book
    test: tests/loans/test_circulation.py::test_return_use_case_rejects_unknown_loan_without_creating_it
    enforced: true
    ledger_rule: unknown-loan-refused

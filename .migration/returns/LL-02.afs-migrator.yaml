rules:
  - capability: loan.lend
    rule: Member and ISBN values must be non-empty and non-whitespace; invalid values are rejected with field errors.
    use_case: lend_loan
    test: tests/loans/test_circulation.py::test_lending_use_case_rejects_missing_and_blank_fields
    enforced: true
    ledger_rule: required-member-and-isbn
  - capability: loan.lend
    rule: A new loan is due 14 calendar days after its lending date.
    use_case: lend_loan
    test: tests/loans/test_circulation.py::test_lending_use_case_creates_a_fourteen_day_loan
    enforced: true
    ledger_rule: fourteen-day-period
  - capability: loan.lend
    rule: A new loan receives id L<count + 1>.
    use_case: lend_loan
    test: tests/loans/test_circulation.py::test_lending_use_case_creates_a_fourteen_day_loan
    enforced: true
    ledger_rule: sequential-loan-id
  - capability: loan.return-date
    rule: A returned loan cannot be returned again; reject the repeat and preserve its original return date.
    use_case: return_loan
    test: tests/loans/test_circulation.py::test_return_use_case_rejects_a_repeat_and_preserves_the_original_date
    enforced: true
    ledger_rule: preserve-first-return-date
  - capability: loan.return-date
    rule: A successful return records and persists the date supplied by the use case.
    use_case: return_loan
    test: tests/loans/test_circulation.py::test_return_use_case_records_the_supplied_date
    enforced: true
    ledger_rule: record-return-date
  - capability: loan.return
    rule: A return request for an unknown loan is rejected and mapped to not found.
    use_case: return_loan
    test: tests/loans/test_circulation.py::test_return_use_case_returns_none_for_an_unknown_loan
    enforced: true
    ledger_rule: known-loan
  - capability: loan.return
    rule: Returning an already-returned loan is rejected instead of replacing its return date.
    use_case: return_loan
    test: tests/loans/test_circulation.py::test_return_use_case_rejects_a_repeat_and_preserves_the_original_date
    enforced: true
    ledger_rule: reject-repeat-return

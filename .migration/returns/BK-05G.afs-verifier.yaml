    ledger_rule: successful-update-completes-dialog
  - capability: booking.dialog-deadline
    rule: An unparseable arrival deadline is refused before the cargo is updated.
    use_case: CargoSpecification.change_deadline
    test: tests/booking/interfaces/test_dialogs.py::test_application_rejects_unparsed_deadline_value
    enforced: true
    ledger_rule: deadline-must-parse
  - capability: booking.dialog-deadline
    rule: Changing the arrival deadline preserves the cargo origin and destination.
    use_case: CargoSpecification.change_deadline
    test: tests/booking/application/test_specification.py::test_change_deadline_preserves_other_specification_fields_and_resets_route_state
    enforced: true
    ledger_rule: deadline-preserves-route-fields
  - capability: booking.dialog-destination
    rule: A destination equal to the cargo origin or current destination is not an allowed selection.
    use_case: CargoSpecification.change_destination
    test: tests/booking/interfaces/test_dialogs.py::test_application_rejects_current_destination_not_offered
    enforced: false
    ledger_rule: destination-options-filtered
  - capability: booking.dialog-destination
    rule: A submitted destination must be one of the currently offered shipping locations.
    use_case: CargoSpecification.change_destination
    test: tests/booking/interfaces/test_dialogs.py::test_application_rejects_current_destination_not_offered
    enforced: false
    ledger_rule: destination-must-be-offered
  - capability: booking.dialog-destination
    rule: Changing the destination preserves the cargo origin and arrival deadline.
    use_case: CargoSpecification.change_destination
    test: tests/booking/application/test_specification.py::test_change_destination_preserves_other_specification_fields_and_resets_route_state
    enforced: true
    ledger_rule: destination-preserves-route-fields

rules:
  - id: required-member-and-isbn
    rule: Missing, blank or whitespace-only member and ISBN fields are rejected with field errors and do not create a loan.
    source: "POST /loans; approved fix in martins-vds/ai-factory-synthetic-target#39"
  - id: member-and-isbn-length
    rule: Member and ISBN values fit the legacy VARCHAR field limit of 255 characters.
    source: "legacy/src/main/java/lib/Loan.java:19-22"
  - id: fourteen-day-loan-period
    rule: A new loan is lent today and is due 14 calendar days later.
    source: "legacy/src/main/java/lib/Loan.java:44-46"
  - id: delimited-field-escaping
    rule: Loan records escape semicolons, quotes and line breaks in member and ISBN values.
    source: "Approved fix in martins-vds/ai-factory-synthetic-target#43; legacy/docs/export-csv.md:1-4"
notes: "Approved quirk rulings #39 (reject blank fields) and #43 (escape export fields) are implemented."
quirks: [martins-vds/ai-factory-synthetic-target#39, martins-vds/ai-factory-synthetic-target#43]

id: billing.card-vault
kind: integration
title: Charge a member through Northgate
source:
  location: legacy-billing/src/main/java/billing/CardVault.java:8-22
boundary: "CardVault sends the member ID and exact whole-cent amount to Northgate in USD, raises on a decline, and returns the approved reference."
tickets: [martins-vds/ai-factory-eval#1778]
status: pending
verification: pending
quirks: []
rules:
  - id: usd-minor-units
    rule: Convert the amount to exact cents and submit it in USD to the Northgate client.
    source: legacy-billing/src/main/java/billing/CardVault.java:16-17
  - id: declined-charge
    rule: A declined charge raises IllegalStateException containing the member ID and provider reason.
    source: legacy-billing/src/main/java/billing/CardVault.java:18-20
  - id: approved-reference
    rule: Return the provider reference for an approved charge.
    source: legacy-billing/src/main/java/billing/CardVault.java:18-22
notes: Credentials are supplied by the caller to VaultCredentials; the executable entry point reads them from NORTHGATE_MERCHANT and NORTHGATE_KEY.

    - src.reports.services.MonthlyReportApplication
    - src.reports.management.commands.monthly_report.Command
    - src.reports.repository.DjangoReportLoanRepository
status: migrated
verification: spec-derived
characterization_tier: C
evidence:
  - tests/reports/test_monthly_report_services.py::test_monthly_report_groups_prior_month_loans_and_orders_by_fees_then_member
  - tests/reports/test_command.py::test_monthly_report_command_outputs_previous_month_as_csv
  - .migration/evidence/runs/LL-05.md
rules:
  - id: prior-month-window
    rule: Include only loans started in the previous calendar month.
    source: legacy/docs/reports-spec.md:4-5
  - id: member-aggregates
    rule: Report each member's loans started, late returns, and late fee cents; omit members without loans started in the month.
    source: legacy/docs/reports-spec.md:5,7
  - id: fee-order
    rule: Sort rows by total late fees descending, then member id.
    source: legacy/docs/reports-spec.md:6
notes: "Only the document remains; the source explicitly states that the separate reporting module and runtime are unavailable."

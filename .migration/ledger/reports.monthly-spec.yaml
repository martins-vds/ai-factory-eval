id: reports.monthly-spec
slice: monthly-report
kind: behavioral
title: Produce the specified monthly lending report
source:
  graph_node: document:legacy/docs/reports-spec.md
  location: legacy/docs/reports-spec.md:1-9
boundary: "The retired report specification calls for a run on each month's first day over the prior month, one row per member with loans started, late returns, and late fees in cents, sorted by fees descending then member id; omit members with no loans in that month."
tickets: [martins-vds/ai-factory-synthetic-target#35, martins-vds/ai-factory-eval#2054]
target:
  components: [src.reports.services.MonthlyReportApplication.report, src.reports.management.commands.monthly_report.Command]
status: migrated
verification: spec-derived
characterization_tier: C
evidence:
  - legacy/docs/reports-spec.md
  - .migration/references/characterization-SY-05.md
  - tests/reports/test_monthly_report.py::test_monthly_report_groups_and_sorts_member_rows
  - tests/reports/test_monthly_report.py::test_monthly_report_command_uses_prior_month_and_does_not_include_other_months
  - .migration/evidence/runs/LL-05.md
rules:
  - id: prior-calendar-month
    rule: "The report covers the half-open prior-calendar-month range from its first day through the following month's first day"
    source: "legacy/docs/reports-spec.md:3"
  - id: qualifying-member
    rule: "Only members with at least one loan started in the report month are included"
    source: "legacy/docs/reports-spec.md:5"
  - id: report-order
    rule: "Rows are sorted by total late fees descending, then by member id ascending"
    source: "legacy/docs/reports-spec.md:6"
  - id: late-fee-cents
    rule: "The report sums fee values in cents using the lending fee formula and excludes the member's loans outside the month"
    source: "legacy/docs/reports-spec.md:4"
notes: "Only the document remains; the source explicitly states that the separate reporting module and runtime are unavailable."

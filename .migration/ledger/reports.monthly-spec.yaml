id: reports.monthly-spec
slice: monthly-report
kind: behavioral
title: Produce the specified monthly lending report
source:
  graph_node: document:legacy/docs/reports-spec.md
  location: legacy/docs/reports-spec.md:1-9
boundary: "The retired report specification calls for a run on each month's first day over the prior month, one row per member with loans started, late returns, and late fees in cents, sorted by fees descending then member id; omit members with no loans in that month."
tickets: [martins-vds/ai-factory-synthetic-target#35, martins-vds/ai-factory-eval#1429]
target:
  components:
    - src.reports.services.MonthlyReportApplication.monthly_report_for
    - src.reports.management.commands.monthly_report.Command.handle
    - src.reports.repository.DjangoMonthlyReportLoanRepository.started_in_period
status: migrated
verification: spec-derived
characterization_tier: C
evidence:
  - tests/reports/test_monthly_report.py::test_monthly_report_aggregates_prior_month_and_orders_members_by_fees_then_id
  - tests/reports/test_monthly_report.py::test_monthly_report_for_january_uses_december_of_the_previous_year
  - tests/reports/test_monthly_report.py::test_monthly_report_command_outputs_only_loans_started_in_the_prior_month
  - .migration/evidence/runs/LL-05.md
rules:
  - id: prior-month-window
    rule: Include loans started on or after the first day of the previous calendar month and before the first day of the current month.
    source: legacy/docs/reports-spec.md:3
  - id: member-aggregation
    rule: Produce one row per member with loans started, late returns, and late fees in cents; omit members with no loans started in the month.
    source: legacy/docs/reports-spec.md:4,6
  - id: report-ordering
    rule: Sort by total late fees descending, then member id ascending.
    source: legacy/docs/reports-spec.md:5
notes: "Only the document remains; the source explicitly states that the separate reporting module and runtime are unavailable."

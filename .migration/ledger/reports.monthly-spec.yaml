id: reports.monthly-spec
slice: monthly-report
kind: behavioral
title: Produce the specified monthly lending report
source:
  graph_node: document:legacy/docs/reports-spec.md
  location: legacy/docs/reports-spec.md:1-9
boundary: "The retired report specification calls for a run on each month's first day over the prior month, one row per member with loans started, late returns, and late fees in cents, sorted by fees descending then member id; omit members with no loans in that month."
tickets:
  - martins-vds/ai-factory-synthetic-target#35
  - martins-vds/ai-factory-eval#1338
target:
  components:
    - src.reports.services.MonthlyReportApplication.run
    - src.reports.repository.DjangoReportLoanRepository.started_between
    - src.reports.management.commands.monthly_report.Command.handle
status: migrated
verification: spec-derived
characterization_tier: C
evidence:
  - legacy/docs/reports-spec.md
  - .migration/references/characterization-SY-05.md
  - .migration/evidence/runs/LL-05.md
  - tests/reports/test_monthly_report.py::test_monthly_report_aggregates_previous_month_and_orders_fee_ties_by_member
  - tests/reports/test_monthly_report.py::test_monthly_report_caps_fees_and_uses_report_date_for_unreturned_loans
  - tests/reports/test_monthly_report.py::test_system_clock_uses_server_default_timezone
  - tests/reports/test_monthly_report.py::test_monthly_report_command_outputs_only_previous_month_loans_as_csv
rules:
  - id: prior-calendar-month
    rule: "Select loans started in the prior calendar month using its inclusive start and exclusive next-month boundary in the server's default time zone."
    source: legacy/docs/reports-spec.md:3; .migration/plan/monthly-report.md:5-12
  - id: member-aggregation
    rule: "Emit one row per member with loans started in the month; omit members without a loan start, and report loan starts, late returns, and late fees in cents."
    source: legacy/docs/reports-spec.md:4,6
  - id: late-returns
    rule: "Count a return as late when its return date is after the due date."
    source: legacy/src/main/java/lib/LateFeeView.java:31-37
  - id: late-fee-calculation
    rule: "Calculate late fees from the return date or report date, waive the first two late days, charge 25 cents per later day, and cap the total at 1000 cents."
    source: legacy/src/main/java/lib/LateFeeView.java:31-37
  - id: report-order
    rule: "Order rows by total late fees descending, then member id ascending."
    source: legacy/docs/reports-spec.md:5
notes: "Only the report specification remains in the source; the target management command produces deterministic CSV from persistent loans."

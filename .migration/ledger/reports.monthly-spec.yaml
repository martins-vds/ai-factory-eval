id: reports.monthly-spec
slice: monthly-report
kind: behavioral
title: Produce the specified monthly lending report
source:
  graph_node: document:legacy/docs/reports-spec.md
  location: legacy/docs/reports-spec.md:1-9
boundary: "The monthly_report management command writes one CSV row per member with loans started in the previous calendar month, late returns and late fees in cents for that month; rows sort by fees descending then member id, and members without starts are omitted."
tickets: [martins-vds/ai-factory-synthetic-target#35, martins-vds/ai-factory-eval#1381]
target:
  components:
    - src.reports.services.MonthlyReportApplication
    - src.reports.repository.DjangoMonthlyReportRepository
    - src.reports.management.commands.monthly_report.Command
status: migrated
verification: spec-derived
characterization_tier: C
evidence:
  - legacy/docs/reports-spec.md
  - .migration/references/characterization-SY-05.md
  - tests/reports/test_monthly_report.py::test_monthly_report_summarizes_the_previous_calendar_month
  - tests/reports/test_monthly_report.py::test_monthly_report_previous_month_crosses_the_year_boundary
  - .migration/evidence/runs/LL-05.md
rules:
  - id: prior-calendar-month
    rule: "Report the previous calendar month relative to the server's default-time-zone date."
    source: "reports-spec.md:6; monthly-report.md:5,16"
  - id: member-inclusion
    rule: "Include only members with at least one loan started in the report month and count those starts."
    source: "reports-spec.md:7,9; monthly-report.md:5"
  - id: late-returns
    rule: "Count loans returned after their due date during the report month."
    source: "reports-spec.md:7; monthly-report.md:5"
  - id: late-fees
    rule: "Sum the existing loan fee calculation in cents for late returns during the report month."
    source: "reports-spec.md:7; fees.calculation.yaml"
  - id: row-order
    rule: "Sort rows by total late fees descending, then member id ascending."
    source: "reports-spec.md:8"
notes: "Only the document remains; the source explicitly states that the separate reporting module and runtime are unavailable."

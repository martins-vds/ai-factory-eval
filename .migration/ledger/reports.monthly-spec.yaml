id: reports.monthly-spec
slice: monthly-report
kind: behavioral
title: Produce the specified monthly lending report
source:
  graph_node: document:legacy/docs/reports-spec.md
  location: legacy/docs/reports-spec.md:1-9
boundary: "The retired report specification calls for a run on each month's first day over the prior month, one row per member with loans started, late returns, and late fees in cents, sorted by fees descending then member id; omit members with no loans in that month."
tickets:
  - martins-vds/ai-factory-synthetic-target#35
  - martins-vds/ai-factory-eval#1413
target:
  components:
    - config.settings.INSTALLED_APPS
    - src.reports.composition.monthly_report_application
    - src.reports.services.MonthlyReportApplication
    - src.reports.repository.DjangoMonthlyReportRepository
    - src.reports.management.commands.monthly_report.Command
status: migrated
verification: spec-derived
characterization_tier: C
evidence:
  - tests/reports/test_monthly_report.py::test_monthly_report_lists_member_totals_for_the_previous_month
  - tests/reports/test_monthly_report.py::test_monthly_report_uses_calendar_months_and_counts_accrued_fees
  - tests/reports/test_monthly_report.py::test_monthly_report_caps_each_loan_fee
  - .migration/evidence/runs/LL-05.md
rules:
  - id: prior-calendar-month
    rule: "Select loans started in the prior calendar month using a half-open date range in the server's default time zone; the external operator runs the command on the month's first day."
    source: ".migration/plan/monthly-report.md"
  - id: member-aggregation
    rule: "Emit one row for each member with at least one loan started in the report month, count those loans, and omit other members."
    source: "legacy/docs/reports-spec.md:6-9"
  - id: late-returns
    rule: "Count each loan started in the report month that has been returned after its due date by report generation time."
    source: "legacy/docs/reports-spec.md:7; .migration/references/characterization-SY-05.md"
  - id: late-fees
    rule: "Sum fees in cents for report-month loans using each loan's return date or the report date if still open; waive up to two late days, charge 25 cents per later day, and cap each loan at 1000 cents."
    source: ".migration/references/characterization-SY-05.md; legacy/src/main/java/lib/LateFeeView.java:31-37"
  - id: ordering
    rule: "Sort by total late fees descending, then member id ascending."
    source: "legacy/docs/reports-spec.md:8"
notes: "Only the document remains; the source explicitly states that the separate reporting module and runtime are unavailable."

id: reports.monthly-spec
slice: monthly-report
kind: behavioral
title: Produce the specified monthly lending report
source:
  graph_node: document:legacy/docs/reports-spec.md
  location: legacy/docs/reports-spec.md:1-9
boundary: "The monthly_report management command prints one CSV row per member with loans started in the prior calendar month, their late returns, and late fees in cents."
tickets: [martins-vds/ai-factory-synthetic-target#35, martins-vds/ai-factory-eval#2336]
target:
  components:
    - src.reports.services.MonthlyReportApplication
    - src.reports.repository.DjangoReportLoanRepository
    - src.reports.management.commands.monthly_report.Command
status: migrated
verification: spec-derived
characterization_tier: C
evidence:
  - .migration/references/characterization-SY-05.md
  - tests/reports/test_monthly_report.py::test_monthly_report_aggregates_the_previous_calendar_month
  - tests/reports/test_command.py::test_monthly_report_command_prints_previous_month_rows_from_database
  - .migration/evidence/runs/LL-05.md
rules:
  - id: previous-month
    rule: Include loans started in the half-open previous calendar month, based on the server-local date.
    source: legacy/docs/reports-spec.md:6-7
  - id: qualifying-members
    rule: Emit one row only for each member with loans started in the report month.
    source: legacy/docs/reports-spec.md:7,9
  - id: late-returns
    rule: Count a loan as returned late only when its return date is later than its due date.
    source: legacy/docs/reports-spec.md:7
  - id: late-fees
    rule: Sum the monthly loans' calculated late fees in cents for each member.
    source: legacy/docs/reports-spec.md:7
  - id: ordering
    rule: Sort rows by total late fees descending, then member id ascending.
    source: legacy/docs/reports-spec.md:8
notes: "Only the document remains; the separate reporting module and runtime are unavailable."

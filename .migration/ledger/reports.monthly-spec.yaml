id: reports.monthly-spec
slice: monthly-report
kind: behavioral
title: Produce the specified monthly lending report
source:
  graph_node: document:legacy/docs/reports-spec.md
  location: legacy/docs/reports-spec.md:1-9
boundary: "The retired report specification calls for a run on each month's first day over the prior month, one row per member with loans started, late returns, and late fees in cents, sorted by fees descending then member id; omit members with no loans in that month."
tickets: [martins-vds/ai-factory-synthetic-target#35]
target:
  components:
    - src.reports.services.MonthlyReport
    - src.reports.repository.DjangoReportLoanRepository
    - src.reports.management.commands.monthly_report.Command
status: migrated
verification: spec-derived
characterization_tier: C
evidence:
  - legacy/docs/reports-spec.md
  - .migration/references/characterization-SY-05.md
  - .migration/evidence/runs/LL-05.md
  - tests/reports/test_monthly_report.py::test_monthly_report_summarizes_prior_month_loan_activity
  - tests/reports/test_monthly_report.py::test_monthly_report_handles_year_boundary_and_month_edges
  - tests/reports/test_monthly_report.py::test_monthly_report_command_outputs_sorted_csv
notes: "Only the document remains; the source explicitly states that the separate reporting module and runtime are unavailable."
rules:
  - id: prior-calendar-month
    rule: "Include loans started in the prior calendar month using a half-open date range in the server's default time zone."
    source: "legacy/docs/reports-spec.md:6; .migration/plan/monthly-report.md:5,16"
  - id: monthly-member-rows
    rule: "Emit one row for each member with loans started in the month, aggregating that month's started loans, late returns, and late fees."
    source: "legacy/docs/reports-spec.md:7-9; .migration/plan/monthly-report.md:5"
  - id: late-return-count
    rule: "Count a loan as a late return only when it has a return date later than its due date."
    source: "legacy/docs/reports-spec.md:7; .migration/ledger/fees.calculation.yaml:10"
  - id: late-fee-amount
    rule: "Calculate late days against returned_on or the local report date, waive up to two days, then charge 25 cents per day capped at 1000 cents."
    source: ".migration/ledger/fees.calculation.yaml:10"
  - id: fee-order
    rule: "Sort rows by total late fees descending, then member id ascending."
    source: "legacy/docs/reports-spec.md:8"

rules:
  - id: loan-exists
    rule: "A payment gateway is called only for an existing loan; an unknown loan returns no payment result."
    source: "FinePayments.java:31-33"
  - id: successful-gateway-response
    rule: "Only gateway HTTP 200 is successful; any other response becomes HTTP 502 and retains the gateway body."
    source: "FinePayments.java:36-38"
  - id: gateway-failure
    rule: "I/O and interrupted calls become HTTP 502 with the unavailable message; an interruption remains attached to the failure."
    source: "FinePayments.java:34-40; decision martins-vds/ai-factory-synthetic-target#40"

rules:
  - id: existing-loan
    rule: The loan must exist before the payment gateway is called.
    source: FinePayments.java:29-31
  - id: gateway-request
    rule: Charge the configured gateway with an empty POST to /charge?loan=<id>; the default URL is https://payments.lending-library.invalid.
    source: FinePayments.java:32-33
  - id: gateway-status
    rule: Only gateway HTTP 200 stays 200; all other responses, including redirects, become 502 while preserving the response body.
    source: FinePayments.java:34-35
  - id: gateway-failure
    rule: I/O and interrupted gateway calls become HTTP 502; an interruption remains available as the failure cause and is logged.
    source: FinePayments.java:36-40; martins-vds/ai-factory-synthetic-target#40

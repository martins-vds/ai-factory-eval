evidence: [.migration/references/characterization-SY-05.md, .migration/evidence/runs/SY-05.md, .migration/characterization/source/goldens/http.json, .migration/characterization/source/goldens/gateway.json, tests/fees/test_views.py::test_payment_api_forwards_gateway_success_and_maps_other_statuses, tests/fees/test_views.py::test_payment_api_does_not_call_gateway_for_an_unknown_loan, tests/fees/test_views.py::test_interrupted_payment_is_a_gateway_failure_without_losing_the_interruption, tests/fees/test_views.py::test_payment_api_maps_gateway_connection_failures, tests/fees/test_views.py::test_fee_page_payment_shows_success_and_gateway_failure, tests/fees/test_views.py::test_ui_payment_rejects_unknown_loans_without_calling_gateway, tests/fees/test_views.py::test_fee_and_payment_routes_reject_unsupported_methods, tests/fees/test_views.py::test_real_browser_can_view_and_pay_late_fee, .migration/evidence/runs/LL-03.md]
rules:
  - {id: known-loan, rule: "A payment request for an unknown loan returns HTTP 404 and must not call the gateway.", source: "FinePayments.java:29-32"}
  - {id: gateway-request, rule: "For an existing loan, send an empty-body POST to /charge?loan={id} at PAYMENT_GATEWAY_URL or the characterized default.", source: "FinePayments.java:33-36"}
  - {id: post-only, rule: "Payment API and browser action accept POST requests only; other methods are rejected with HTTP 405.", source: "FinePayments.java:26-28"}
  - {id: gateway-response, rule: "A gateway HTTP 200 returns HTTP 200 with its body; every other HTTP status returns HTTP 502 with the gateway body.", source: "FinePayments.java:37"}
  - {id: gateway-failure, rule: "I/O failures and interrupted calls return HTTP 502 with the unavailable message; interruption context is retained in the logged exception chain.", source: "FinePayments.java:38-40; quirk ruling martins-vds/ai-factory-synthetic-target#40"}
quirks: [martins-vds/ai-factory-synthetic-target#40]

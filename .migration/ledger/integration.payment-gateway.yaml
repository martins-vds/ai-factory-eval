id: integration.payment-gateway
slice: fees-payments
kind: integration
title: Charge loan fees through the payment gateway
source:
  graph_node: endpoint:legacy/src/main/java/lib/FinePayments.java:POST /payments/{id}
  flow: Pay Late Fee
  location: legacy/src/main/java/lib/FinePayments.java:26-40
  risk: {crap: 4, complexity: 4, coverage: 0.75}
boundary: "POST /payments/{id} first requires an existing loan, then POSTs /charge?loan={id} to PAYMENT_GATEWAY_URL or the configured default; gateway HTTP 200 is returned as 200, other responses and I/O/interruption failures become 502."
tickets: [martins-vds/ai-factory-synthetic-target#35]
target:
  components: [src.fees.gateway.HttpPaymentGateway.charge, src.fees.payments.PaymentApplication.pay, src.fees.views.payment_endpoint, src.fees.views.payment_page]
status: migrated
verification: differential
characterization_tier: A
evidence: [.migration/references/characterization-SY-05.md, .migration/evidence/runs/SY-05.md, .migration/characterization/source/goldens/http.json, .migration/characterization/source/goldens/gateway.json, .migration/evidence/runs/LL-03.md, tests/fees/test_fees.py::test_payment_endpoint_calls_gateway_and_returns_success, tests/fees/test_fees.py::test_payment_endpoint_maps_gateway_failure_to_bad_gateway, tests/fees/test_fees.py::test_payment_endpoint_does_not_call_gateway_for_unknown_loan, tests/fees/test_fees.py::test_payment_endpoint_maps_gateway_io_failure_to_bad_gateway, tests/fees/test_fees.py::test_payment_endpoint_preserves_interruption_as_gateway_failure, tests/fees/test_fees.py::test_browser_payment_action_uses_htmx_partial, tests/fees/test_fees.py::test_browser_payment_failure_is_visible_to_htmx]
rules:
  - id: existing-loan
    rule: "A missing loan returns HTTP 404 and must not trigger a gateway request."
    source: "FinePayments.java:29-30"
  - id: gateway-request
    rule: "An existing loan is charged with an empty-body POST to /charge?loan={id} at PAYMENT_GATEWAY_URL or the configured default."
    source: "FinePayments.java:32-34"
  - id: gateway-status
    rule: "Only gateway HTTP 200 maps to HTTP 200; every other gateway status maps to HTTP 502 with the gateway response body."
    source: "FinePayments.java:35-36"
  - id: gateway-unavailable
    rule: "I/O failures and interrupted calls return HTTP 502 with the unavailable message; an interruption remains observable in the exception chain and error log."
    source: "FinePayments.java:37-39; martins-vds/ai-factory-synthetic-target#40"
notes: "The source swallows InterruptedException while returning 502; preserving the interruption follows the approved fix ruling in #40."
quirks: [martins-vds/ai-factory-synthetic-target#40]

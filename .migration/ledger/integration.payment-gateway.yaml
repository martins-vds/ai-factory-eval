  - tests/fees/test_views.py::test_ui_payment_error_fragment_renders_gateway_failure
rules:
  - id: loan-required
    rule: Reject an unknown loan before making a payment-gateway request.
    source: legacy/src/main/java/lib/FinePayments.java:30-32
  - id: gateway-status
    rule: Return gateway HTTP 200 as 200 and map every other gateway status to 502 while preserving its body.
    source: legacy/src/main/java/lib/FinePayments.java:35-37
  - id: gateway-failure
    rule: Map gateway I/O failures to HTTP 502 with the payment-gateway-unavailable body.
    source: legacy/src/main/java/lib/FinePayments.java:38-40
  - id: preserve-interruption
    rule: Surface an interrupted payment call as a 502 gateway failure while retaining the interruption.
    source: martins-vds/ai-factory-synthetic-target#40
notes: "The approved #40 fix retains the InterruptedError on PaymentResult while surfacing the gateway failure as HTTP 502."
quirks: [martins-vds/ai-factory-synthetic-target#40]

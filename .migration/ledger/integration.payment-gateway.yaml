  - tests/fees/test_fees.py::test_htmx_payment_action_displays_the_gateway_result
  - tests/fees/test_fees.py::test_htmx_payment_action_displays_gateway_failure
notes: "Human ruling #40 approved the fix: the interruption is retained as the gateway failure's cause instead of being swallowed."
quirks: [martins-vds/ai-factory-synthetic-target#40]

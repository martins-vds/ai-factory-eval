rules:
  - id: existing-loan-before-charge
    rule: Do not call the payment gateway unless the loan exists.
    source: FinePayments.java:30-32
  - id: gateway-status
    rule: A gateway HTTP 200 remains 200; every other HTTP status becomes 502 while preserving its response body.
    source: FinePayments.java:34-37
  - id: interrupted-payment
    rule: Gateway I/O or interruption becomes a 502 gateway failure, and the original interruption remains its cause.
    source: Decision map #38, ruling #40; FinePayments.java:34-40

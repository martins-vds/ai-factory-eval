notes: "The source swallowed InterruptedException; ruling #40 fixes this by retaining the InterruptedError on the 502 PaymentResult."
quirks: [martins-vds/ai-factory-synthetic-target#40]
rules:
  - id: loan-exists
    rule: An unknown loan returns 404 and must not be sent to the payment gateway.
    source: FinePayments.java:30-32
  - id: gateway-status
    rule: Gateway HTTP 200 remains 200; all other HTTP responses return 502.
    source: FinePayments.java:35-39
  - id: gateway-io-failure
    rule: Gateway I/O failures return HTTP 502 with the unavailable message.
    source: FinePayments.java:37-39
  - id: retain-interruption
    rule: An interrupted gateway call returns 502 while retaining the original InterruptedError.
    source: martins-vds/ai-factory-synthetic-target#40

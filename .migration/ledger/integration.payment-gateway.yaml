evidence: [.migration/references/characterization-SY-05.md, .migration/evidence/runs/SY-05.md, .migration/characterization/source/goldens/http.json, .migration/characterization/source/goldens/gateway.json]
target:
  components:
    - src.fees.gateway.charge_loan
    - src.fees.views.payment_api

id: integration.payment-gateway
slice: fees-payments
kind: integration
title: Charge loan fees through the payment gateway
source:
  graph_node: endpoint:legacy/src/main/java/lib/FinePayments.java:POST /payments/{id}
  flow: Pay Late Fee
  location: legacy/src/main/java/lib/FinePayments.java:26-40
  risk: {crap: 4, complexity: 4, coverage: 0.75}
boundary: "POST /payments/{id} first requires an existing loan, then POSTs /charge?loan={id} to PAYMENT_GATEWAY_URL or the configured default; gateway HTTP 200 is returned as 200, other responses and I/O/interruption failures become 502."
tickets: [martins-vds/ai-factory-synthetic-target#35]
target:
  components:
  - src.fees.services.PaymentApplication.pay
  - src.fees.gateway.HttpPaymentGateway.charge
  - src.fees.views.pay
  - src.fees.views.pay_page
status: migrated
verification: differential
characterization_tier: A
notes: "The source swallows InterruptedException while returning 502; the approved fix ruling preserves the interruption while surfacing a gateway failure."
quirks: [martins-vds/ai-factory-synthetic-target#40]
rules:
- id: loan-exists-before-charge
  rule: An unknown loan returns 404 without sending a payment-gateway request.
  source: legacy/src/main/java/lib/FinePayments.java:29-31
- id: gateway-success-status
  rule: Only gateway HTTP 200 is a successful payment response; all other gateway status codes become 502.
  source: legacy/src/main/java/lib/FinePayments.java:34-37
- id: gateway-unavailable
  rule: Gateway I/O failures become HTTP 502 with the unavailable message.
  source: legacy/src/main/java/lib/FinePayments.java:34-40
- id: interruption-preserved
  rule: An interrupted gateway request surfaces as a gateway failure without losing the interruption.
  source: martins-vds/ai-factory-synthetic-target#40

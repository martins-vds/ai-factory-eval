rules:
  - id: loan-required
    rule: "A payment gateway charge is attempted only for an existing loan."
    source: legacy/src/main/java/lib/FinePayments.java:30
  - id: gateway-success
    rule: "Gateway HTTP 200 remains 200; every other gateway status maps to 502 with its response body preserved."
    source: legacy/src/main/java/lib/FinePayments.java:33-36
  - id: gateway-io-failure
    rule: "A payment-gateway I/O failure maps to HTTP 502 with the unavailable message."
    source: legacy/src/main/java/lib/FinePayments.java:37-40
  - id: interruption-preserved
    rule: "An interrupted gateway call maps to HTTP 502 without discarding the original interruption."
    source: martins-vds/ai-factory-synthetic-target#40
notes: "The approved fix in martins-vds/ai-factory-synthetic-target#40 maps interruptions to HTTP 502 while preserving the original InterruptedError on the payment result."
quirks: [martins-vds/ai-factory-synthetic-target#40]

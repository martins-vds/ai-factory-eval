rules:
  - id: payment-requires-loan
    rule: An unknown loan returns 404 without calling the gateway.
    source: legacy/src/main/java/lib/FinePayments.java:26-40
  - id: payment-gateway-200
    rule: A gateway HTTP 200 response is returned as 200 with its body.
    source: legacy/src/main/java/lib/FinePayments.java:26-40
  - id: payment-gateway-non-200
    rule: A gateway response other than HTTP 200 is mapped to 502 with its body.
    source: legacy/src/main/java/lib/FinePayments.java:26-40
  - id: payment-gateway-io-failure
    rule: A gateway I/O failure returns 502 with the unavailable message.
    source: legacy/src/main/java/lib/FinePayments.java:26-40
  - id: payment-interruption-retained
    rule: An interrupted gateway request returns 502 and retains its interruption context.
    source: martins-vds/ai-factory-synthetic-target#40
quirks: [martins-vds/ai-factory-synthetic-target#40]
notes: "The approved #40 fix maps interruption to 502 while retaining it on PaymentResult.interruption."

rules:
  - id: loan-exists-before-charge
    rule: "Reject an unknown loan before making a payment-gateway request."
    source: "legacy/src/main/java/lib/FinePayments.java:29-31"
  - id: gateway-status
    rule: "Return HTTP 200 only for gateway HTTP 200; map other gateway statuses to HTTP 502 and preserve their body."
    source: "legacy/src/main/java/lib/FinePayments.java:35-37"
  - id: gateway-io-failure
    rule: "Map gateway I/O failures to HTTP 502 with the unavailable message."
    source: "legacy/src/main/java/lib/FinePayments.java:38-40"
  - id: preserve-interruption
    rule: "An interrupted gateway call returns HTTP 502 while retaining the interruption."
    source: "martins-vds/ai-factory-synthetic-target#40"

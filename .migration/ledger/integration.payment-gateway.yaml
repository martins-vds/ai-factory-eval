rules:
  - id: known-loan
    rule: A payment is sent only for an existing loan; an unknown loan is not sent to the gateway.
    source: legacy/src/main/java/lib/FinePayments.java:32-33
  - id: gateway-status
    rule: Only gateway HTTP 200 succeeds; all other gateway statuses become HTTP 502 with the gateway body.
    source: legacy/src/main/java/lib/FinePayments.java:36-38
  - id: interruption
    rule: An interrupted gateway call becomes a gateway failure while retaining the interruption as its cause.
    source: martins-vds/ai-factory-synthetic-target#40
quirks: [martins-vds/ai-factory-synthetic-target#40]
notes: "The #40 ruling fixes the swallowed interruption by preserving it as the gateway failure's cause."

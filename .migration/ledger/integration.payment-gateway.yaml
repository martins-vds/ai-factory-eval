status: migrated
rules:
  - id: loan-exists
    rule: "Return 404 for an unknown loan without making a gateway request."
    source: "legacy/src/main/java/lib/FinePayments.java:29-31"
  - id: gateway-request
    rule: "POST an empty body to /charge?loan={id} at PAYMENT_GATEWAY_URL or its configured default."
    source: "legacy/src/main/java/lib/FinePayments.java:33-35"
  - id: gateway-status
    rule: "Return HTTP 200 only for gateway HTTP 200; map other gateway responses to HTTP 502 and preserve their body."
    source: "legacy/src/main/java/lib/FinePayments.java:33-35"
  - id: gateway-failure
    rule: "Map I/O failures to HTTP 502 with `payment gateway unavailable` and a trailing newline."
    source: "legacy/src/main/java/lib/FinePayments.java:36-40"
  - id: interruption
    rule: "Map an interrupted call to HTTP 502 while preserving the interruption as the gateway failure's cause."
    source: "martins-vds/ai-factory-synthetic-target#40"
evidence:
  - .migration/evidence/runs/LL-03.md
  - tests/fees/test_fees.py::test_payment_api_forwards_the_characterized_request_to_the_gateway
  - tests/fees/test_fees.py::test_payment_api_maps_non_success_gateway_responses_to_502
  - tests/fees/test_fees.py::test_payment_api_does_not_call_gateway_for_an_unknown_loan
  - tests/fees/test_fees.py::test_interrupted_gateway_call_keeps_the_interruption_as_its_cause

id: integration.payment-gateway
slice: fees-payments
kind: integration
title: Charge loan fees through the payment gateway
source:
  graph_node: endpoint:legacy/src/main/java/lib/FinePayments.java:POST /payments/{id}
  flow: Pay Late Fee
  location: legacy/src/main/java/lib/FinePayments.java:26-40
  risk: {crap: 4, complexity: 4, coverage: 0.75}
boundary: "POST /payments/{id} first requires an existing loan, then POSTs /charge?loan={id} to PAYMENT_GATEWAY_URL or the configured default; gateway HTTP 200 is returned as 200, other responses and I/O/interruption failures become 502."
tickets: [martins-vds/ai-factory-synthetic-target#35, martins-vds/ai-factory-eval#1175]
target:
  components:
    - src.fees.gateway.PaymentGateway
    - src.fees.services.PaymentApplication
    - src.fees.views.payment
    - src.fees.views.fee_payment
    - templates/fees/payment-result.html
status: migrated
verification: differential
characterization_tier: A
evidence:
  - .migration/references/characterization-SY-05.md
  - .migration/evidence/runs/SY-05.md
  - .migration/characterization/source/goldens/http.json
  - .migration/characterization/source/goldens/gateway.json
  - .migration/evidence/runs/LL-03.md
  - tests/fees/test_fees.py::test_payment_endpoint_preserves_gateway_contract
  - tests/fees/test_fees.py::test_payment_api_accepts_characterized_post_without_browser_csrf_token
  - tests/fees/test_fees.py::test_payment_endpoint_does_not_call_gateway_for_unknown_loan
  - tests/fees/test_fees.py::test_payment_endpoint_maps_connection_failure_to_gateway_failure
  - tests/fees/test_fees.py::test_payment_endpoint_logs_interruption_while_returning_gateway_failure
  - tests/fees/test_fees.py::test_fee_payment_action_renders_gateway_failure_for_htmx
  - tests/fees/test_fees.py::test_browser_payment_action_keeps_csrf_protection
  - tests/fees/test_fees.py::test_real_browser_can_pay_a_late_fee
rules:
  - id: loan-required
    rule: Reject an unknown loan with 404 before making any gateway request.
    source: legacy/src/main/java/lib/FinePayments.java:30-31
  - id: gateway-request
    rule: POST an empty body to /charge?loan={id} at PAYMENT_GATEWAY_URL or the configured default.
    source: legacy/src/main/java/lib/FinePayments.java:33-35
  - id: gateway-response
    rule: Forward a gateway HTTP 200 as 200; map any other gateway status to 502 while preserving its body.
    source: legacy/src/main/java/lib/FinePayments.java:35-36
  - id: gateway-unavailable
    rule: Map I/O failures to 502 with the payment gateway unavailable message.
    source: legacy/src/main/java/lib/FinePayments.java:37-39
  - id: gateway-interrupted
    rule: Surface an interrupted gateway call as a failure while preserving the interruption as the causal exception.
    source: martins-vds/ai-factory-synthetic-target#40
quirks: [martins-vds/ai-factory-synthetic-target#40]

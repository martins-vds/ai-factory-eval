id: reporting.monthly-spec
kind: behavioral
title: Monthly lending report specification
source:
  graph_node: document:legacy/docs/reports-spec.md
  location: legacy/docs/reports-spec.md:1-9
boundary: "The remaining report specification describes a first-of-month report for the preceding month, grouped by member, ordered by fees then member ID, and omitting members with no loans."
status: pending
verification: pending
rules:
  - id: reporting-window
    rule: The report is run on the first day of each month for the previous month.
    source: legacy/docs/reports-spec.md:6
  - id: member-rows
    rule: Each row contains member ID, loans started, loans returned late, and total late fees in cents; members with no loans in the month are omitted.
    source: legacy/docs/reports-spec.md:7,9
  - id: report-order
    rule: Rows sort by total late fees descending, then by member ID.
    source: legacy/docs/reports-spec.md:8
notes: The document says the reporting module was a separate product and its code/runtime are no longer available; see .migration/quirks/monthly-report-no-runtime.md.

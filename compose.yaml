services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lending_library
      POSTGRES_USER: lending_library
      POSTGRES_PASSWORD: lending_library_local
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: lending_library
      POSTGRES_USER: lending_library
      POSTGRES_PASSWORD: lending_library
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lending_library -d lending_library"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
